<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ブロック大砲 60秒</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c1a;
  --panel:#ffffff;
  --panel-text:#14172b;
  --muted:#5b6285;
  --line:rgba(20,23,43,.14);
  --chip:#eceffb;
  --accent:#ff3d5a;
  --gold:#ffb703;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#171b38;
    --panel-text:#f2f4ff;
    --muted:#9aa2cf;
    --line:rgba(255,255,255,.14);
    --chip:#242a54;
  }
}
:root[data-theme="dark"]{
  --panel:#171b38;
  --panel-text:#f2f4ff;
  --muted:#9aa2cf;
  --line:rgba(255,255,255,.14);
  --chip:#242a54;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  color:#fff;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
canvas#game{display:block;touch-action:none}

.overlay{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(5,6,16,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  padding:12px;z-index:5;
}
.overlay.show{display:flex}
.card{
  width:min(92vw,380px);max-height:calc(100dvh - 24px);overflow:auto;touch-action:pan-y;
  background:var(--panel);color:var(--panel-text);border-radius:26px;padding:20px 20px 16px;
  box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 1px var(--line);text-align:center;
}
.logo{font-family:"Dela Gothic One","Hiragino Sans",sans-serif;line-height:1.02;margin:2px 0 0}
.logo span{display:block;font-size:26px;letter-spacing:.04em}
.logo b{
  display:block;font-weight:400;font-size:58px;letter-spacing:.02em;
  background:linear-gradient(95deg,#ff3d5a 10%,#ff8a3d 55%,#ffb703 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  transform:rotate(-2deg);
}
.sub{margin:8px 0 12px;color:var(--muted);font-size:14px;font-weight:600}
.pv{display:flex;align-items:center;justify-content:center;gap:12px}
#prev{width:132px;height:132px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 3px var(--panel),0 0 0 4px var(--line);flex:none}
.pvside{text-align:left;font-size:13px;color:var(--muted);line-height:1.5;font-weight:600}
.pvside strong{display:block;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:19px;color:var(--panel-text)}
.presets{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 2px}
.presets button{
  aspect-ratio:1;border:3px solid transparent;border-radius:12px;padding:0;overflow:hidden;
  background:var(--chip);cursor:pointer;
}
.presets button.sel{border-color:var(--accent)}
.presets button:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid #4d8dff;outline-offset:2px}
.presets canvas{width:100%;height:100%;display:block}
.btn{
  display:block;width:100%;border:0;border-radius:16px;padding:13px;margin-top:10px;
  font:inherit;font-weight:800;font-size:16px;cursor:pointer;text-align:center;
  box-shadow:0 5px 0 rgba(0,0,0,.26);transition:transform .06s,box-shadow .06s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.26)}
.btn.ghost{background:var(--chip);color:var(--panel-text)}
.btn.primary{
  background:linear-gradient(180deg,#ff6b81,#ff3d5a);color:#fff;
  font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-weight:400;font-size:24px;padding:16px;
}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--muted);font-weight:700}
.chip{border:0;border-radius:99px;padding:8px 14px;background:var(--chip);color:var(--panel-text);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.how{list-style:none;margin:12px 0 0;padding:12px 0 0;border-top:1px solid var(--line);text-align:left;font-size:12.5px;line-height:1.7;color:var(--muted);font-weight:600}
.how li::before{content:"・"}
.tag{font-family:"Dela Gothic One",sans-serif;font-size:22px;letter-spacing:.06em;color:var(--muted)}
.big{
  font-family:"Dela Gothic One",sans-serif;font-size:96px;line-height:1.05;margin:2px 0 0;
  background:linear-gradient(180deg,#ffb703,#ff3d5a);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.unit{font-weight:800;font-size:16px;margin-bottom:6px}
.new{display:none;margin:4px auto 6px;padding:4px 14px;border-radius:99px;background:var(--gold);color:#3a2500;font-weight:900;font-size:13px;width:max-content}
.new.show{display:block;animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.stats div{background:var(--chip);border-radius:14px;padding:9px 4px;font-size:11.5px;color:var(--muted);font-weight:700}
.stats b{display:block;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:22px;color:var(--panel-text)}
@media (prefers-reduced-motion: reduce){.new.show{animation:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>

<div id="menu" class="overlay show">
  <div class="card">
    <h1 class="logo"><span>60秒で壊せ！</span><b>ブロック大砲</b></h1>
    <p class="sub">画像が 18×18 のブロックになって降ってくる</p>
    <div class="pv">
      <canvas id="prev" width="360" height="360"></canvas>
      <div class="pvside"><strong>この画像で遊ぶ</strong>中央が正方形に<br>切り取られます</div>
    </div>
    <div class="presets" id="presets"></div>
    <label class="btn ghost" for="file">📷 好きな画像を選ぶ</label>
    <input type="file" id="file" accept="image/*" style="display:none">
    <button class="btn primary" id="startBtn" type="button">スタート</button>
    <div class="row"><span id="bestLine">BEST 0</span><button class="chip" id="soundBtn" type="button">🔊 サウンド ON</button></div>
    <ul class="how">
      <li>画面をドラッグして狙い、指を離すと発射（長押しでは撃たない）</li>
      <li>当てるほどコンボ。爆発が 3×3、5×5 に強化</li>
      <li>全部壊すと、また上からドサドサ降ってくる</li>
    </ul>
  </div>
</div>

<div id="result" class="overlay">
  <div class="card">
    <div class="tag">TIME UP</div>
    <div class="big" id="resScore">0</div>
    <div class="unit">ブロック破壊</div>
    <div class="new" id="resNew">NEW RECORD!</div>
    <div class="stats">
      <div><b id="resClear">0</b>全消し</div>
      <div><b id="resCombo">0</b>最大コンボ</div>
      <div><b id="resAcc">0%</b>命中率</div>
    </div>
    <div class="row" style="justify-content:center;margin:6px 0 0"><span id="resBest">BEST 0</span></div>
    <button class="btn primary" id="retryBtn" type="button">もう一回</button>
    <button class="btn ghost" id="menuBtn" type="button">画像を変える</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ============ 定数 ============ */
const W = 360, COLS = 18, ROWS = 18, CELL = 19, GRID = CELL * COLS, GX = (W - GRID) / 2;
const SRC = 432, SC = SRC / COLS;              // 元画像 432px → 1ブロック 24px
const GAME_TIME = 60, FIRE_INTERVAL = 0.22, BALL_SPEED = 1050;
const FRAG_CAP = 700, SPARK_CAP = 450;
const TIER_COL = ['#7fd6ff', '#ffd166', '#ff5d8f'];
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const FXK = reduce ? 0.35 : 1;

let H = 640, GY = 72, k = 1;
let fontOK = false;
const FONT = '"Dela Gothic One","Hiragino Sans","Noto Sans JP",system-ui,sans-serif';
if (document.fonts && document.fonts.load) {
  document.fonts.load('20px "Dela Gothic One"').then(f => { fontOK = f.length > 0; }).catch(() => {});
}
const FT = s => (fontOK ? '' : 'bold ') + s + 'px ' + FONT;

const store = {
  get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
  set(key, v) { try { localStorage.setItem(key, v); } catch (e) {} },
  del(key) { try { localStorage.removeItem(key); } catch (e) {} }
};

/* ============ サウンド (WebAudio 合成) ============ */
const Snd = {
  ctx: null, master: null, noise: null, on: true,
  init() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        const comp = this.ctx.createDynamicsCompressor();
        comp.threshold.value = -16; comp.knee.value = 20; comp.ratio.value = 8;
        comp.attack.value = 0.003; comp.release.value = 0.15;
        this.master = this.ctx.createGain();
        this.master.gain.value = this.on ? 0.9 : 0;
        this.master.connect(comp); comp.connect(this.ctx.destination);
        const n = this.ctx.sampleRate;
        const b = this.ctx.createBuffer(1, n, n), d = b.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        this.noise = b;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  setOn(v) { this.on = v; if (this.master) this.master.gain.value = v ? 0.9 : 0; },
  tone(type, f0, f1, dur, vol, delay) {
    if (!this.ctx || !this.on) return;
    const c = this.ctx, t = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.03);
  },
  nz(dur, vol, type, f0, f1, q, delay) {
    if (!this.ctx || !this.on || !this.noise) return;
    const c = this.ctx, t = c.currentTime + (delay || 0);
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t, Math.random() * 0.1); s.stop(t + dur + 0.03);
  },
  shoot(tier) {
    this.nz(0.14, 0.5, 'bandpass', 2600, 500, 0.9);
    this.tone('sawtooth', 300, 40, 0.2, 0.3);
    this.tone('sine', 140, 38, 0.25, 0.7);
    if (tier > 0) this.tone('square', 500 + tier * 250, 180, 0.16, 0.09);
  },
  destroy(n, combo, tier) {
    this.nz(0.3, 0.55, 'lowpass', 4200, 260, 0.8);
    this.nz(0.2, 0.28, 'highpass', 5200, 9500, 0.7);
    this.tone('sine', 170 + tier * 20, 42, 0.22, 0.75);
    const sc = [0, 2, 4, 7, 9], cnt = Math.min(n, 8);
    for (let i = 0; i < cnt; i++) {
      const idx = Math.min(combo, 14) + i;
      const semi = sc[idx % 5] + 12 * Math.floor(idx / 5);
      const f = 294 * Math.pow(2, semi / 12);
      this.tone('triangle', f, f * 1.02, 0.15, 0.16, i * 0.028);
      this.tone('sine', f * 2, f * 2, 0.09, 0.06, i * 0.028);
    }
    if (tier >= 1) this.tone('sawtooth', 95, 30, 0.32, 0.4);
    if (tier >= 2) this.nz(0.5, 0.3, 'lowpass', 1800, 120, 1);
  },
  comboUp() {
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
      this.tone('triangle', f, f, 0.2, 0.17, i * 0.055);
      this.tone('sine', f * 2, f * 2, 0.12, 0.05, i * 0.055);
    });
  },
  comboBreak() { this.tone('triangle', 420, 140, 0.22, 0.1); },
  wall() { this.tone('triangle', 900, 700, 0.05, 0.06); },
  clear() {
    [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5].forEach((f, i) => {
      this.tone('square', f, f, 0.22, 0.09, i * 0.09);
      this.tone('triangle', f, f, 0.3, 0.2, i * 0.09);
    });
    this.nz(0.7, 0.3, 'highpass', 500, 9000, 0.8);
  },
  fall() {
    this.tone('sine', 1800, 260, 0.85, 0.06);
    this.nz(0.9, 0.12, 'lowpass', 1400, 180, 0.8);
  },
  thud(v) {
    this.tone('sine', 115, 38, 0.18, 0.25 * v);
    this.nz(0.1, 0.12 * v, 'lowpass', 700, 150, 0.7);
  },
  beep(f) { this.tone('square', f, f, 0.14, 0.13); },
  go() { this.tone('square', 1320, 1320, 0.35, 0.14); this.tone('triangle', 660, 1320, 0.3, 0.25); this.nz(0.3, 0.2, 'highpass', 1000, 6000, 0.7); },
  tick(urgent) { this.tone('square', urgent ? 1500 : 1000, urgent ? 1500 : 1000, 0.05, 0.08); },
  timeup() {
    this.tone('sawtooth', 500, 80, 1, 0.3);
    this.nz(1, 0.4, 'lowpass', 3000, 100, 1);
    this.tone('sine', 80, 40, 1, 0.6);
  },
  click() { this.tone('triangle', 700, 1000, 0.08, 0.12); }
};
function vib(ms) { try { if (Snd.on && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ============ 画像 ============ */
const cv = $('game'), ctx = cv.getContext('2d');
const srcCv = document.createElement('canvas'); srcCv.width = srcCv.height = SRC;
const sheetCv = document.createElement('canvas'); sheetCv.width = sheetCv.height = SRC;
const prevCv = $('prev'), pctx = prevCv.getContext('2d');
let avg = [];

function buildSheet() {
  const g = sheetCv.getContext('2d');
  g.clearRect(0, 0, SRC, SRC);
  g.drawImage(srcCv, 0, 0);
  const b = 2.6;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const x = c * SC, y = r * SC;
    g.fillStyle = 'rgba(255,255,255,.32)'; g.fillRect(x, y, SC, b); g.fillRect(x, y, b, SC);
    g.fillStyle = 'rgba(0,0,0,.36)'; g.fillRect(x, y + SC - b, SC, b); g.fillRect(x + SC - b, y, b, SC);
  }
  const m = document.createElement('canvas'); m.width = m.height = COLS * 4;
  const mg = m.getContext('2d'); mg.imageSmoothingQuality = 'high'; mg.drawImage(srcCv, 0, 0, COLS * 4, COLS * 4);
  const t = document.createElement('canvas'); t.width = COLS; t.height = ROWS;
  const tg = t.getContext('2d'); tg.imageSmoothingQuality = 'high'; tg.drawImage(m, 0, 0, COLS, ROWS);
  let d = null;
  try { d = tg.getImageData(0, 0, COLS, ROWS).data; } catch (e) {}
  avg = [];
  for (let i = 0; i < COLS * ROWS; i++) avg.push(d ? [d[i * 4], d[i * 4 + 1], d[i * 4 + 2]] : [200, 200, 230]);
  pctx.clearRect(0, 0, prevCv.width, prevCv.height);
  pctx.drawImage(sheetCv, 0, 0, prevCv.width, prevCv.height);
}
function setImageFrom(fn) {
  const g = srcCv.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, SRC, SRC);
  g.imageSmoothingQuality = 'high';
  fn(g);
  buildSheet();
}

const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
function emojiPreset(emoji, c1, c2) {
  return g => {
    const gr = g.createLinearGradient(0, 0, SRC, SRC);
    gr.addColorStop(0, c1); gr.addColorStop(1, c2);
    g.fillStyle = gr; g.fillRect(0, 0, SRC, SRC);
    g.save(); g.translate(SRC / 2, SRC / 2); g.fillStyle = 'rgba(255,255,255,.14)';
    for (let i = 0; i < 12; i++) {
      g.rotate(Math.PI / 6);
      g.beginPath(); g.moveTo(0, 0); g.lineTo(SRC, -SRC * 0.12); g.lineTo(SRC, SRC * 0.12); g.closePath(); g.fill();
    }
    g.restore();
    g.font = Math.round(SRC * 0.7) + 'px ' + EMOJI_FONT;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(emoji, SRC / 2, SRC / 2 + SRC * 0.04);
  };
}
function sunsetPreset(g) {
  const s = SRC;
  let gr = g.createLinearGradient(0, 0, 0, s * 0.66);
  gr.addColorStop(0, '#1b1464'); gr.addColorStop(0.55, '#d63384'); gr.addColorStop(1, '#ffb703');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
  g.fillStyle = 'rgba(255,255,255,.8)';
  for (let i = 0; i < 26; i++) { const x = (i * 97) % s, y = (i * 53) % (s * 0.3); g.fillRect(x, y, 2, 2); }
  g.fillStyle = '#fff3b0'; g.beginPath(); g.arc(s / 2, s * 0.56, s * 0.2, 0, 7); g.fill();
  g.fillStyle = '#e8368f';
  for (let i = 0; i < 5; i++) g.fillRect(s * 0.28, s * (0.56 + i * 0.03), s * 0.44, s * 0.008 * (i + 1));
  g.fillStyle = '#3b1a6b'; g.beginPath(); g.moveTo(0, s * 0.68);
  g.lineTo(s * 0.18, s * 0.5); g.lineTo(s * 0.33, s * 0.64); g.lineTo(s * 0.5, s * 0.55); g.lineTo(s * 0.7, s * 0.66);
  g.lineTo(s * 0.86, s * 0.52); g.lineTo(s, s * 0.66); g.lineTo(s, s * 0.68); g.closePath(); g.fill();
  gr = g.createLinearGradient(0, s * 0.66, 0, s);
  gr.addColorStop(0, '#2a0f5e'); gr.addColorStop(1, '#0b0f2b');
  g.fillStyle = gr; g.fillRect(0, s * 0.66, s, s * 0.34);
  g.fillStyle = 'rgba(255,214,102,.75)';
  for (let i = 0; i < 9; i++) { const w = s * (0.32 - i * 0.03); g.fillRect(s / 2 - w / 2, s * (0.69 + i * 0.033), w, 5); }
}
const PRESETS = [
  emojiPreset('🐱', '#ffd6e8', '#8ecbff'),
  emojiPreset('😎', '#ffe066', '#ff8a3d'),
  emojiPreset('🍩', '#8ff0e4', '#b79cff'),
  emojiPreset('🚀', '#101a3d', '#7b3fe4'),
  sunsetPreset
];
const presetBtns = [];
(function buildPresetUI() {
  const box = $('presets'), tmp = document.createElement('canvas'); tmp.width = tmp.height = SRC;
  PRESETS.forEach((fn, i) => {
    const tg = tmp.getContext('2d'); tg.clearRect(0, 0, SRC, SRC); fn(tg);
    const th = document.createElement('canvas'); th.width = th.height = 96;
    th.getContext('2d').drawImage(tmp, 0, 0, 96, 96);
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'サンプル画像 ' + (i + 1));
    b.appendChild(th);
    b.addEventListener('click', () => {
      Snd.init(); Snd.click();
      setImageFrom(fn); store.set('bc_preset', String(i)); store.del('bc_img'); markPreset(i);
    });
    box.appendChild(b); presetBtns.push(b);
  });
})();
function markPreset(i) { presetBtns.forEach((b, j) => b.classList.toggle('sel', j === i)); }

function applyImage(img) {
  setImageFrom(g => {
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, s = Math.min(iw, ih);
    g.drawImage(img, (iw - s) / 2, (ih - s) / 2, s, s, 0, 0, SRC, SRC);
  });
  markPreset(-1);
  try { store.set('bc_img', srcCv.toDataURL('image/jpeg', 0.85)); } catch (e) {}
}
function loadFile(file) {
  if (!file || !file.type || file.type.indexOf('image/') !== 0) return;
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => { applyImage(img); URL.revokeObjectURL(url); Snd.init(); Snd.click(); };
  img.onerror = () => URL.revokeObjectURL(url);
  img.src = url;
}
$('file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

// 初期画像
(function initImage() {
  const pi = parseInt(store.get('bc_preset') || '0', 10) || 0;
  setImageFrom(PRESETS[Math.min(pi, PRESETS.length - 1)]); markPreset(Math.min(pi, PRESETS.length - 1));
  const saved = store.get('bc_img');
  if (saved) {
    const img = new Image();
    img.onload = () => { setImageFrom(g => g.drawImage(img, 0, 0, SRC, SRC)); markPreset(-1); };
    img.src = saved;
  }
})();

/* ============ ゲーム状態 ============ */
let state = 'menu';   // menu | ready | play | ending | over
let t = 0, timeLeft = GAME_TIME, lastSec = GAME_TIME;
let score = 0, best = parseInt(store.get('bc_best') || '0', 10) || 0;
let combo = 0, maxCombo = 0, clears = 0, shots = 0, hits = 0, newRecord = false;
let readyT = 0, lastCount = 4, endT = 0, respawn = -1;
let aim = 0, targetAim = 0, fireCd = 0, holding = false;
let recoil = 0, muzzleT = 0, shake = 0, flash = 0, slowT = 0, comboPop = 0, scorePop = 0, pulse = 0;
let cells = [];
let alive = 0;
const balls = [], frags = [], sparks = [], rings = [], pops = [], texts = [], smoke = [], confetti = [], banners = [];
const stars = Array.from({ length: 46 }, () => ({ x: Math.random() * W, y: Math.random() * 800, r: Math.random() * 1.4 + 0.4, ph: Math.random() * 6.28 }));
$('bestLine').textContent = 'BEST ' + best;

const SHAPES = [[], [], []];
for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
  const m = Math.abs(dr) + Math.abs(dc), ch = Math.max(Math.abs(dr), Math.abs(dc));
  if (m <= 1) SHAPES[0].push([dr, dc]);
  if (ch <= 1) SHAPES[1].push([dr, dc]);
  if (m <= 3 && ch <= 2) SHAPES[2].push([dr, dc]);
}
const curTier = () => combo >= 15 ? 2 : combo >= 6 ? 1 : 0;
const cannonY = () => H - 64;

function clearFx() {
  [balls, frags, sparks, rings, pops, texts, smoke, confetti, banners].forEach(a => a.length = 0);
}
function banner(text, size, color, y, life) {
  banners.push({ text, size, color, y, life, max: life });
}

function spawnGrid() {
  cells = []; alive = ROWS * COLS;
  const start = -(GY + GRID + 60);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    cells.push({
      r, c, alive: true, ready: false, landed: false, bounced: 0, vy: 0,
      off: start - Math.random() * 30,
      delay: (ROWS - 1 - r) * 0.04 + Math.random() * 0.05
    });
  }

}

/* ============ 発射・当たり ============ */
function fire() {
  const cx = W / 2, cy = cannonY();
  const dx = Math.sin(aim), dy = -Math.cos(aim), tier = curTier();
  balls.push({ x: cx + dx * 56, y: cy + dy * 56, vx: dx * BALL_SPEED, vy: dy * BALL_SPEED, bounces: 0, tier, trail: [] });
  shots++; recoil = 1; muzzleT = 0.09; shake = Math.max(shake, 2.6 * FXK);
  for (let i = 0; i < 6; i++) {
    const a = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.9, sp = 60 + Math.random() * 180;
    smoke.push({ x: cx + dx * 54, y: cy + dy * 54, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 5 + Math.random() * 5, life: 0, max: 0.5 + Math.random() * 0.3 });
  }
  Snd.shoot(tier);
}

function miss() {
  if (combo >= 5) Snd.comboBreak();
  combo = 0;
}

function hit(ball, cell) {
  hits++; combo++; comboPop = 1;
  if (combo > maxCombo) maxCombo = combo;
  const tier = ball.tier, shape = SHAPES[tier], list = [];
  for (const [dr, dc] of shape) {
    const rr = cell.r + dr, cc = cell.c + dc;
    if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) continue;
    const q = cells[rr * COLS + cc];
    if (q.alive && q.ready) { q.alive = false; alive--; list.push(q); }
  }
  const n = list.length;
  score += n; scorePop = 1;
  const ex = GX + cell.c * CELL + CELL / 2, ey = GY + cell.r * CELL + CELL / 2;
  list.forEach(q => breakFx(q, ex, ey, tier));
  const rr = 46 + tier * 34;
  rings.push({ x: ex, y: ey, r: 6, max: rr, life: 0, dur: 0.36, col: '255,255,255' });
  if (tier >= 1) rings.push({ x: ex, y: ey, r: 4, max: rr * 1.35, life: 0, dur: 0.5, col: tier === 2 ? '255,93,143' : '255,209,102' });
  texts.push({ x: ex, y: ey - 10, s: '+' + n, size: Math.min(36, 18 + n * 1.2), col: TIER_COL[tier], life: 0, max: 0.75 });
  shake = Math.max(shake, Math.min(13, (2 + n * 0.55 + tier * 2)) * FXK);
  pulse = Math.min(1, pulse + 0.3 + tier * 0.15);
  if (tier >= 1 || n >= 8) { flash = Math.max(flash, (0.1 + tier * 0.06) * FXK); slowT = Math.max(slowT, tier >= 1 ? 0.05 : 0); }
  Snd.destroy(n, combo, tier);
  vib(Math.min(30, 8 + n * 2));
  if (combo === 6) { banner('POWER UP! 3×3', 40, '#ffd166', GY + GRID * 0.5, 0.9); Snd.comboUp(); }
  else if (combo === 15) { banner('MEGA BLAST! 5×5', 40, '#ff5d8f', GY + GRID * 0.5, 1); Snd.comboUp(); }
  else if (combo % 5 === 0) {
    const words = ['NICE!', 'GREAT!', 'AMAZING!', 'FANTASTIC!', 'UNSTOPPABLE!'];
    banner(words[Math.min(words.length, combo / 5) - 1], 46, '#fff', GY + GRID * 0.5, 0.8); Snd.comboUp();
  }
  if (alive === 0 && respawn < 0) {
    respawn = 0.95; clears++;
    banner('ALL CLEAR!', 54, '#ffe066', GY + GRID * 0.42, 1.3);
    Snd.clear(); slowT = 0.08; shake = 10 * FXK;
    for (let i = 0; i < 120 * FXK + 20; i++) {
      confetti.push({
        x: W / 2 + (Math.random() - 0.5) * 60, y: GY + GRID * 0.5,
        vx: (Math.random() - 0.5) * 700, vy: -Math.random() * 520 - 120,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 18,
        w: 5 + Math.random() * 6, h: 3 + Math.random() * 4,
        col: ['#ff3d5a', '#ffb703', '#7fd6ff', '#8ff0a4', '#c4a3ff', '#fff'][i % 6], life: 0, max: 1.6 + Math.random() * 0.8
      });
    }
  }
}

function breakFx(q, ex, ey, tier) {
  const bx = GX + q.c * CELL + CELL / 2, by = GY + q.r * CELL + CELL / 2;
  let dx = bx - ex, dy = by - ey; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
  if (d < 1) { const a = Math.random() * 6.28; dx = Math.cos(a); dy = Math.sin(a); }
  const col = avg[q.r * COLS + q.c] || [200, 200, 230];
  pops.push({ x: bx, y: by, life: 0, max: 0.16 });
  for (let i = 0; i < 4 && frags.length < FRAG_CAP; i++) {
    const a = Math.atan2(dy, dx) + (Math.random() - 0.5) * 1.5, sp = 170 + Math.random() * 330 + tier * 60;
    frags.push({
      x: bx + ((i % 2) - 0.5) * CELL / 2, y: by + ((i >> 1) - 0.5) * CELL / 2,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 140 - Math.random() * 170,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 22, life: 0, max: 0.8 + Math.random() * 0.5,
      sx: q.c * SC + (i % 2) * SC / 2, sy: q.r * SC + (i >> 1) * SC / 2, s: CELL / 2 * (0.9 + Math.random() * 0.5)
    });
  }
  const bright = 'rgb(' + Math.min(255, col[0] + 90) + ',' + Math.min(255, col[1] + 90) + ',' + Math.min(255, col[2] + 90) + ')';
  for (let i = 0; i < 2 && sparks.length < SPARK_CAP; i++) {
    const a = Math.atan2(dy, dx) + (Math.random() - 0.5) * 2.2, sp = 250 + Math.random() * 380;
    sparks.push({ x: bx, y: by, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: 0.28 + Math.random() * 0.25, col: bright });
  }
}

/* ============ 入力 ============ */
function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function setAim(p) {
  const dx = p.x - W / 2, dy = Math.max(cannonY() - p.y, 40);
  targetAim = Math.max(-1.35, Math.min(1.35, Math.atan2(dx, dy)));
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  holding = true; Snd.init(); setAim(canvasPos(e));
});
cv.addEventListener('pointermove', e => { if (holding || e.pointerType === 'mouse') setAim(canvasPos(e)); });
function tryFire() {
  if (state === 'play' && fireCd <= 0) { fire(); fireCd = FIRE_INTERVAL; }
}
addEventListener('pointerup', e => {
  if (!holding) return;
  holding = false;
  setAim(canvasPos(e)); aim = targetAim;
  tryFire();
});
addEventListener('pointercancel', () => { holding = false; });
addEventListener('blur', () => { holding = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (!e.repeat && ['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code) && state === 'play') tryFire();
  if (state !== 'menu' && ['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

/* ============ 進行 ============ */
function startGame() {
  Snd.init();
  score = 0; combo = 0; maxCombo = 0; clears = 0; shots = 0; hits = 0; newRecord = false;
  timeLeft = GAME_TIME; lastSec = GAME_TIME; respawn = -1; fireCd = 0;
  clearFx(); spawnGrid();
  state = 'ready'; readyT = 0; lastCount = 4;
  $('menu').classList.remove('show'); $('result').classList.remove('show');
}
function endGame() {
  state = 'ending'; endT = 0; combo = 0; balls.length = 0; respawn = -1;
  banner('TIME UP!', 62, '#fff', GY + GRID * 0.5, 1.6);
  Snd.timeup(); shake = 8 * FXK;
  if (score > best) { newRecord = true; best = score; store.set('bc_best', String(best)); }
}
function showResult() {
  state = 'over';
  $('resClear').textContent = clears; $('resCombo').textContent = maxCombo;
  $('resAcc').textContent = (shots ? Math.round(hits / shots * 100) : 0) + '%';
  $('resBest').textContent = 'BEST ' + best;
  $('resNew').classList.toggle('show', newRecord);
  $('bestLine').textContent = 'BEST ' + best;
  $('result').classList.add('show');
  const t0 = performance.now(); let shown = -1, ticks = 0;
  (function step() {
    const p = Math.min(1, (performance.now() - t0) / 900);
    const v = Math.round(score * (1 - Math.pow(1 - p, 3)));
    if (v !== shown) { shown = v; if (++ticks % 4 === 0) Snd.tick(false); $('resScore').textContent = v; }
    if (p < 1) requestAnimationFrame(step);
  })();
}
$('startBtn').addEventListener('click', () => { Snd.init(); Snd.click(); startGame(); });
$('retryBtn').addEventListener('click', () => { Snd.click(); startGame(); });
$('menuBtn').addEventListener('click', () => {
  Snd.click(); state = 'menu'; cells = []; clearFx();
  $('result').classList.remove('show'); $('menu').classList.add('show');
});
$('soundBtn').addEventListener('click', () => {
  Snd.init(); Snd.setOn(!Snd.on);
  $('soundBtn').textContent = Snd.on ? '🔊 サウンド ON' : '🔇 サウンド OFF';
  if (Snd.on) Snd.click();
});

/* ============ 更新 ============ */
function update(dt) {
  t += dt;
  // 照準
  if (keys.ArrowLeft || keys.KeyA) targetAim -= 1.9 * dt;
  if (keys.ArrowRight || keys.KeyD) targetAim += 1.9 * dt;
  targetAim = Math.max(-1.35, Math.min(1.35, targetAim));
  aim += (targetAim - aim) * Math.min(1, dt * 30);

  fireCd -= dt;

  if (state === 'ready') {
    readyT += dt;
    const n = 3 - Math.floor(readyT / 0.8);
    if (n !== lastCount) {
      lastCount = n;
      if (n >= 1) { banner(String(n), 120, '#fff', GY + GRID * 0.5, 0.75); Snd.beep(n === 1 ? 880 : 660); }
    }
    if (readyT >= 2.4) { state = 'play'; banner('GO!', 100, '#ffd166', GY + GRID * 0.5, 0.8); Snd.go(); }
  } else if (state === 'play') {
    timeLeft -= dt;
    const sec = Math.ceil(timeLeft);
    if (sec !== lastSec) { lastSec = sec; if (sec <= 10 && sec > 0) Snd.tick(sec <= 3); }
    if (timeLeft <= 0) { timeLeft = 0; endGame(); }
    if (respawn >= 0) { respawn -= dt; if (respawn < 0) spawnGrid(); }
  } else if (state === 'ending') {
    endT += dt; if (endT > 1.5) showResult();
  }

  // ブロック落下
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (c.landed) continue;
    if (c.delay > 0) { c.delay -= dt; continue; }
    c.vy += 2800 * dt; c.off += c.vy * dt;
    if (c.off >= 0) {
      c.off = 0;
      if (!c.ready) {
        c.ready = true;
        if (c.c === 9) { Snd.thud(0.5 + 0.5 * (c.r / ROWS)); shake = Math.max(shake, 1.6 * FXK); }
      }
      if (c.bounced < 1 && c.vy > 600) { c.vy = -c.vy * 0.25; c.bounced++; } else { c.vy = 0; c.landed = true; }
    }
  }

  // 砲弾
  for (const b of balls) {
    const steps = Math.max(1, Math.ceil(BALL_SPEED * dt / 4)), sd = dt / steps;
    for (let s = 0; s < steps; s++) {
      b.x += b.vx * sd; b.y += b.vy * sd;
      if (b.x < 6) { b.x = 6; b.vx = -b.vx; b.bounces++; Snd.wall(); }
      else if (b.x > W - 6) { b.x = W - 6; b.vx = -b.vx; b.bounces++; Snd.wall(); }
      const c = Math.floor((b.x - GX) / CELL), r = Math.floor((b.y - GY) / CELL);
      if (c >= 0 && c < COLS && r >= 0 && r < ROWS) {
        const q = cells[r * COLS + c];
        if (q && q.alive && q.ready) { hit(b, q); b.dead = true; break; }
      }
      if (b.y < -30 || b.bounces > 3) { b.dead = true; miss(); break; }
    }
    b.trail.push({ x: b.x, y: b.y }); if (b.trail.length > 9) b.trail.shift();
  }
  for (let i = balls.length - 1; i >= 0; i--) if (balls[i].dead) balls.splice(i, 1);

  // パーティクル
  for (let i = frags.length - 1; i >= 0; i--) {
    const f = frags[i]; f.life += dt;
    if (f.life > f.max) { frags[i] = frags[frags.length - 1]; frags.pop(); continue; }
    f.vy += 1150 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt; f.vx *= 1 - dt * 0.6;
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const f = sparks[i]; f.life += dt;
    if (f.life > f.max) { sparks[i] = sparks[sparks.length - 1]; sparks.pop(); continue; }
    f.vy += 400 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 1 - dt * 1.5; f.vy *= 1 - dt * 1.5;
  }
  for (let i = smoke.length - 1; i >= 0; i--) {
    const f = smoke[i]; f.life += dt;
    if (f.life > f.max) { smoke.splice(i, 1); continue; }
    f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 1 - dt * 3; f.vy *= 1 - dt * 3; f.r += dt * 26;
  }
  for (let i = confetti.length - 1; i >= 0; i--) {
    const f = confetti[i]; f.life += dt;
    if (f.life > f.max) { confetti.splice(i, 1); continue; }
    f.vy += 900 * dt; f.vx *= 1 - dt * 1.2; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
  }
  for (const arr of [rings, pops, texts, banners]) {
    for (let i = arr.length - 1; i >= 0; i--) {
      const f = arr[i];
      if (arr === banners) { f.life -= dt; if (f.life <= 0) arr.splice(i, 1); continue; }
      f.life += dt;
      if (f.life > (f.dur || f.max)) { arr.splice(i, 1); continue; }
      if (arr === texts) f.y -= 55 * dt;
    }
  }
  shake *= Math.exp(-dt * 11); if (shake < 0.05) shake = 0;
  flash = Math.max(0, flash - dt * 1.6);
  recoil = Math.max(0, recoil - dt * 7);
  muzzleT = Math.max(0, muzzleT - dt);
  comboPop = Math.max(0, comboPop - dt * 5);
  scorePop = Math.max(0, scorePop - dt * 6);
  pulse = Math.max(0, pulse - dt * 2.2);
}

/* ============ 描画 ============ */
function txt(s, x, y, size, col, align, sw) {
  ctx.font = FT(size); ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';
  if (sw) { ctx.lineWidth = sw; ctx.strokeStyle = 'rgba(10,12,30,.65)'; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const easeBack = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

function drawGuide() {
  const cx = W / 2, cy = cannonY(), dx0 = Math.sin(aim), dy0 = -Math.cos(aim);
  let x = cx + dx0 * 56, y = cy + dy0 * 56, dx = dx0, dy = dy0, bn = 0, hitCell = null;
  const pts = [[x, y]];
  for (let i = 0; i < 340; i++) {
    x += dx * 4; y += dy * 4;
    if (x < 6) { x = 6; dx = -dx; bn++; pts.push([x, y]); } else if (x > W - 6) { x = W - 6; dx = -dx; bn++; pts.push([x, y]); }
    if (bn > 1 || y < -10) break;
    const c = Math.floor((x - GX) / CELL), r = Math.floor((y - GY) / CELL);
    if (c >= 0 && c < COLS && r >= 0 && r < ROWS) {
      const q = cells[r * COLS + c];
      if (q && q.alive && q.ready) { hitCell = q; break; }
    }
  }
  pts.push([x, y]);
  ctx.save();
  ctx.setLineDash([2, 8]); ctx.lineDashOffset = -t * 40; ctx.lineCap = 'round'; ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
  ctx.setLineDash([]);
  if (hitCell) {
    const tier = curTier(), col = TIER_COL[tier], a = 0.6 + 0.3 * Math.sin(t * 10);
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.6;
    for (const [dr, dc] of SHAPES[tier]) {
      const rr = hitCell.r + dr, cc = hitCell.c + dc;
      if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) continue;
      const q = cells[rr * COLS + cc];
      if (!q.alive || !q.ready) continue;
      ctx.globalAlpha = 0.16; ctx.fillRect(GX + cc * CELL, GY + rr * CELL, CELL, CELL);
      ctx.globalAlpha = a; ctx.strokeRect(GX + cc * CELL + 1, GY + rr * CELL + 1, CELL - 2, CELL - 2);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawCannon() {
  const cx = W / 2, cy = cannonY(), tier = curTier();
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(cx, cy + 36, 58, 9, 0, 0, 7); ctx.fill();
  for (const s of [-1, 1]) {
    const wx = cx + s * 31, wy = cy + 17;
    ctx.fillStyle = '#1d2140'; ctx.beginPath(); ctx.arc(wx, wy, 18, 0, 7); ctx.fill();
    ctx.strokeStyle = '#7d86c9'; ctx.lineWidth = 4; ctx.stroke();
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const a = aim * 3 + i * Math.PI / 3;
      ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + Math.cos(a) * 15, wy + Math.sin(a) * 15); ctx.stroke();
    }
    ctx.fillStyle = '#c9d0ff'; ctx.beginPath(); ctx.arc(wx, wy, 5, 0, 7); ctx.fill();
  }
  let g = ctx.createLinearGradient(0, cy, 0, cy + 22);
  g.addColorStop(0, '#59629a'); g.addColorStop(1, '#2a3060');
  ctx.fillStyle = g; rrect(cx - 42, cy + 3, 84, 18, 8); ctx.fill();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(aim); ctx.translate(0, recoil * 12);
  g = ctx.createLinearGradient(-14, 0, 14, 0);
  g.addColorStop(0, '#3b4270'); g.addColorStop(0.35, '#c4ccff'); g.addColorStop(1, '#3f4780');
  ctx.fillStyle = g; rrect(-13, -50, 26, 58, 5); ctx.fill();
  ctx.fillStyle = '#2c3157'; ctx.fillRect(-15, -53, 30, 9); ctx.fillRect(-14, -24, 28, 5);
  ctx.fillStyle = TIER_COL[tier]; ctx.fillRect(-15, -45, 30, 2.5);
  ctx.fillStyle = '#0a0c1a'; ctx.beginPath(); ctx.ellipse(0, -53, 10, 3.5, 0, 0, 7); ctx.fill();
  ctx.restore();
  g = ctx.createRadialGradient(cx - 5, cy - 5, 2, cx, cy, 17);
  g.addColorStop(0, '#f1f3ff'); g.addColorStop(1, '#5b6390');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 16, 0, 7); ctx.fill();
  ctx.fillStyle = '#1d2140'; ctx.beginPath(); ctx.arc(cx, cy, 5, 0, 7); ctx.fill();
  if (tier > 0 && state === 'play') {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = TIER_COL[tier]; ctx.globalAlpha = 0.35 + 0.3 * Math.sin(t * 12); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, 24 + tier * 3, 0, 7); ctx.stroke(); ctx.restore();
  }
}

function draw() {
  const sx = shake ? (Math.random() - 0.5) * shake * 2 : 0, sy = shake ? (Math.random() - 0.5) * shake * 2 : 0;
  ctx.setTransform(k, 0, 0, k, k * sx, k * sy);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  // 背景
  let g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b0f2b'); g.addColorStop(0.6, '#1a1147'); g.addColorStop(1, '#2b1042');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  for (const s of stars) {
    ctx.globalAlpha = 0.25 + 0.35 * Math.sin(t * 1.6 + s.ph);
    ctx.fillStyle = '#cfd6ff'; ctx.fillRect(s.x, s.y % H, s.r, s.r);
  }
  ctx.globalAlpha = 1;
  if (pulse > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    g = ctx.createRadialGradient(W / 2, GY + GRID / 2, 20, W / 2, GY + GRID / 2, 320);
    g.addColorStop(0, 'rgba(120,90,255,' + (0.28 * pulse) + ')'); g.addColorStop(1, 'rgba(120,90,255,0)');
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40); ctx.restore();
  }
  // 床
  g = ctx.createLinearGradient(0, H - 34, 0, H);
  g.addColorStop(0, '#20265a'); g.addColorStop(1, '#0d1030');
  ctx.fillStyle = g; ctx.fillRect(-20, H - 34, W + 40, 60);
  ctx.fillStyle = '#4a53a8'; ctx.fillRect(-20, H - 34, W + 40, 2);

  // グリッド枠とゴースト
  ctx.fillStyle = 'rgba(255,255,255,.035)'; rrect(GX - 5, GY - 5, GRID + 10, GRID + 10, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.globalAlpha = state === 'menu' || state === 'over' ? 0.4 : 0.1;
  ctx.drawImage(srcCv, GX, GY, GRID, GRID); ctx.globalAlpha = 1;

  // ブロック
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (!c.alive) continue;
    const y = GY + c.r * CELL + c.off;
    if (y < -CELL) continue;
    ctx.drawImage(sheetCv, c.c * SC, c.r * SC, SC, SC, GX + c.c * CELL, y, CELL, CELL);
  }

  if (state === 'play' || state === 'ready') drawGuide();

  // 煙
  for (const f of smoke) {
    const p = f.life / f.max;
    ctx.globalAlpha = 0.5 * (1 - p); ctx.fillStyle = '#c9d0ff';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 破片
  const kk = k;
  for (const f of frags) {
    const p = f.life / f.max, a = p > 0.65 ? 1 - (p - 0.65) / 0.35 : 1;
    const cs = Math.cos(f.rot) * kk, sn = Math.sin(f.rot) * kk;
    ctx.setTransform(cs, sn, -sn, cs, kk * (f.x + sx), kk * (f.y + sy));
    ctx.globalAlpha = a;
    ctx.drawImage(sheetCv, f.sx, f.sy, SC / 2, SC / 2, -f.s / 2, -f.s / 2, f.s, f.s);
  }
  ctx.setTransform(k, 0, 0, k, k * sx, k * sy); ctx.globalAlpha = 1;

  // 加算合成エフェクト
  ctx.globalCompositeOperation = 'lighter';
  for (const f of pops) {
    const p = f.life / f.max, s = CELL * (1 + p * 0.5);
    ctx.globalAlpha = 0.9 * (1 - p); ctx.fillStyle = '#fff';
    ctx.fillRect(f.x - s / 2, f.y - s / 2, s, s);
  }
  ctx.lineCap = 'round';
  for (const f of sparks) {
    const p = f.life / f.max;
    ctx.globalAlpha = 1 - p; ctx.strokeStyle = f.col; ctx.lineWidth = 2.4 * (1 - p * 0.5);
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x - f.vx * 0.035, f.y - f.vy * 0.035); ctx.stroke();
  }
  for (const f of rings) {
    const p = f.life / f.dur, r = f.r + (f.max - f.r) * (1 - Math.pow(1 - p, 3));
    ctx.globalAlpha = 1 - p; ctx.strokeStyle = 'rgb(' + f.col + ')'; ctx.lineWidth = 1 + 6 * (1 - p);
    ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, 7); ctx.stroke();
  }
  // 砲弾
  for (const b of balls) {
    const col = TIER_COL[b.tier], n = b.trail.length;
    for (let i = 0; i < n; i++) {
      const p = (i + 1) / n;
      ctx.globalAlpha = 0.5 * p; ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(b.trail[i].x, b.trail[i].y, (3 + b.tier) * p + 1, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 0.4; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(b.x, b.y, 12 + b.tier * 2, 0, 7); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, 5.5 + b.tier, 0, 7); ctx.fill();
  }
  // マズルフラッシュ
  if (muzzleT > 0) {
    const cx = W / 2 + Math.sin(aim) * 58, cy = cannonY() - Math.cos(aim) * 58, p = muzzleT / 0.09, r = 20 + 30 * p;
    g = ctx.createRadialGradient(cx, cy, 1, cx, cy, r);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,190,80,.8)'); g.addColorStop(1, 'rgba(255,90,30,0)');
    ctx.globalAlpha = p; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  drawCannon();

  // コンボ表示
  if ((state === 'play' || state === 'ending') && combo >= 2) {
    const y = GY + GRID + 40, s = 1 + comboPop * 0.35, tier = curTier();
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(s, s);
    txt(String(combo), -4, 0, 38, TIER_COL[tier], 'right', 5);
    txt('COMBO', 4, 0, 16, '#fff', 'left', 4);
    if (tier > 0) txt(tier === 1 ? 'POWER 3×3' : 'MEGA 5×5', 0, 20, 13, TIER_COL[tier], 'center', 3);
    ctx.restore();
  }

  // テキスト(+n)
  for (const f of texts) {
    const p = f.life / f.max, s = p < 0.15 ? 0.6 + 0.6 * (p / 0.15) : 1.2 - 0.2 * Math.min(1, (p - 0.15) / 0.3);
    ctx.globalAlpha = p > 0.6 ? 1 - (p - 0.6) / 0.4 : 1;
    ctx.save(); ctx.translate(f.x, f.y); ctx.scale(s, s); txt(f.s, 0, 0, f.size, f.col, 'center', 5); ctx.restore();
  }
  ctx.globalAlpha = 1;

  // 紙吹雪
  for (const f of confetti) {
    const p = f.life / f.max, cs = Math.cos(f.rot) * kk, sn = Math.sin(f.rot) * kk;
    ctx.setTransform(cs, sn, -sn, cs, kk * (f.x + sx), kk * (f.y + sy));
    ctx.globalAlpha = p > 0.7 ? 1 - (p - 0.7) / 0.3 : 1; ctx.fillStyle = f.col;
    ctx.fillRect(-f.w / 2, -f.h / 2, f.w, f.h);
  }
  ctx.setTransform(k, 0, 0, k, k * sx, k * sy); ctx.globalAlpha = 1;

  drawHUD();

  // バナー
  for (const b of banners) {
    const p = 1 - b.life / b.max, s = p < 0.18 ? easeBack(p / 0.18) : 1, rem = b.life / b.max;
    ctx.globalAlpha = rem < 0.3 ? rem / 0.3 : 1;
    ctx.save(); ctx.translate(W / 2, b.y); ctx.scale(s, s);
    txt(b.text, 0, b.size * 0.35, b.size, b.color, 'center', Math.max(6, b.size * 0.14));
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.5, flash) + ')'; ctx.fillRect(-20, -20, W + 40, H + 40); }
}

function drawHUD() {
  const urgent = state === 'play' && timeLeft <= 10;
  const shownT = Math.ceil(Math.max(0, timeLeft));
  txt('TIME', 16, 20, 11, 'rgba(255,255,255,.6)', 'left');
  ctx.save();
  if (urgent) { const s = 1 + 0.08 * Math.abs(Math.sin(t * 6)); ctx.translate(16, 52); ctx.scale(s, s); ctx.translate(-16, -52); }
  txt(String(shownT), 16, 52, 36, urgent ? '#ff5d6f' : '#fff', 'left', 5);
  ctx.restore();
  txt('BREAK', W - 16, 20, 11, 'rgba(255,255,255,.6)', 'right');
  ctx.save(); const s = 1 + scorePop * 0.3; ctx.translate(W - 16, 52); ctx.scale(s, s);
  txt(String(score), 0, 0, 36, '#ffd166', 'right', 5); ctx.restore();
  txt('BEST ' + Math.max(best, score), W / 2, 20, 11, 'rgba(255,255,255,.55)', 'center');
  const bw = GRID, bx = GX, by = 58, p = Math.max(0, timeLeft / GAME_TIME);
  ctx.fillStyle = 'rgba(255,255,255,.14)'; rrect(bx, by, bw, 6, 3); ctx.fill();
  if (p > 0) {
    const gr = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    gr.addColorStop(0, urgent ? '#ff3d5a' : '#7fd6ff'); gr.addColorStop(1, urgent ? '#ff8a3d' : '#ffb703');
    ctx.fillStyle = gr; rrect(bx, by, Math.max(6, bw * p), 6, 3); ctx.fill();
  }
}

/* ============ リサイズ / ループ ============ */
function resize() {
  const vw = innerWidth, vh = innerHeight;
  H = Math.max(560, Math.min(760, Math.round(W * vh / vw)));
  GY = 72 + Math.round(Math.max(0, H - 640) * 0.25);
  const s = Math.min(vw / W, vh / H), cw = Math.floor(W * s), ch = Math.floor(H * s);
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  k = cv.width / W;
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

let last = performance.now();
function loop(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (slowT > 0) { slowT -= dt; dt *= 0.25; }
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
