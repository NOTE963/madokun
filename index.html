<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>海の国 - 領土戦争</title>
<style>
:root{--bg:#06172b;--panel:#0e2a47;--line:#1f4a75;--text:#e8f4ff;--sub:#8fb4d6;--accent:#ffd54a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:2px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px;flex-wrap:wrap}
.top h1{font-size:17px;margin:0}
#stats{font-size:12px;color:var(--sub);display:flex;gap:10px;flex-wrap:wrap}
#stats b{color:var(--accent)}
nav{display:flex}
nav button{flex:1;padding:11px 4px;background:none;border:0;border-bottom:3px solid transparent;color:var(--sub);font-size:14px;font-weight:600;cursor:pointer}
nav button.on{color:var(--text);border-bottom-color:var(--accent);background:#12365a}
main{max-width:860px;margin:0 auto;padding:10px}
section{display:none}section.on{display:block}
canvas{width:100%;display:block;border:2px solid var(--line);border-radius:10px;touch-action:manipulation;background:#0b4a7a}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.card h3{margin:0 0 6px;font-size:15px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{background:#1a5c94;color:#fff;border:0;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.4}
.btn.land{background:#2e7d32}.btn.air{background:#6a4bc4}.btn.sea{background:#0277bd}.btn.red{background:#c62828}
.rank{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line)}
.rank.me{background:#173f66;border-radius:8px}
.rank .no{width:34px;text-align:center;font-weight:800;font-size:16px}
.rank .dot{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid #fff5}
.rank .nm{flex:1;min-width:0}
.rank .nm small{display:block;color:var(--sub);font-size:11px}
.bar{height:6px;background:#0006;border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%}
.rank .tl{font-weight:800;color:var(--accent);white-space:nowrap}
.log{font-size:13px;padding:6px 4px;border-bottom:1px solid var(--line)}
.log small{color:var(--sub);margin-right:6px}
.unit{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.unit:last-child{border:0}
#overlay{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#overlay .box{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:20px;max-width:380px;width:100%}
#overlay input[type=text]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#06172b;color:var(--text);font-size:16px;margin:6px 0 10px}
#overlay input[type=color]{width:60px;height:38px;border:0;background:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000d;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90%}
#toast.show{opacity:1}
.hint{color:var(--sub);font-size:12px;margin-top:6px;line-height:1.6}
.banner{background:#7a5b00;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px;display:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>🌊 海の国 領土戦争</h1>
    <div id="stats"></div>
  </div>
  <nav id="tabs">
    <button data-tab="map" class="on">🗺️ マップ</button>
    <button data-tab="rank">🏆 ランキング</button>
    <button data-tab="army">⚔️ 軍隊</button>
    <button data-tab="log">📜 戦況</button>
  </nav>
</header>

<main>
  <div class="banner" id="banner"></div>

  <section id="s-map" class="on">
    <canvas id="cv"></canvas>
    <div class="card" id="panel">マスをタップして選択してください。</div>
  </section>

  <section id="s-rank">
    <div class="card"><h3>🏆 領土ランキング(広い順)</h3><div id="rankList"></div></div>
  </section>

  <section id="s-army">
    <div class="card">
      <h3>軍隊を増強する</h3>
      <div id="armyList"></div>
      <div class="hint">
        相性:<b>空 ▶ 陸 ▶ 海 ▶ 空</b>(有利な相手には1.5倍、不利な相手には0.6倍)<br>
        ・陸軍:隣接するマスのみ攻撃可能<br>
        ・海軍:自国から3マス以内を攻撃可能<br>
        ・空軍:自国から6マス以内を攻撃可能<br>
        攻撃側は選んだ兵種の全兵力を投入。防衛側は全兵種で守ります。
      </div>
    </div>
  </section>

  <section id="s-log">
    <div class="card"><h3>📜 最新の出来事</h3><div id="logList"></div></div>
  </section>
</main>

<div id="overlay">
  <div class="box">
    <h2 style="margin:0 0 8px">🏝️ 建国しよう</h2>
    <div style="font-size:13px;color:var(--sub)">国名と国旗カラーを決めてください。</div>
    <input type="text" id="nName" maxlength="12" placeholder="国名(例:エッグ王国)">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <span>国の色</span><input type="color" id="nColor" value="#ff7043">
    </div>
    <button class="btn" id="nGo" style="width:100%;font-size:15px;padding:12px">建国する</button>
  </div>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ===== Firebase =====
const firebaseConfig = {
  apiKey: "AIzaSyCPXBVbdVCYHdop8KTlEQ310p2ZGPIoL04",
  authDomain: "egg-man-8980e.firebaseapp.com",
  databaseURL: "https://egg-man-8980e-default-rtdb.firebaseio.com",
  projectId: "egg-man-8980e",
  storageBucket: "egg-man-8980e.firebasestorage.app",
  messagingSenderId: "664061097830",
  appId: "1:664061097830:web:248329aa1cfadfb6d4baa7",
  measurementId: "G-9G3C4S54YS"
};

const $ = id => document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),2200)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

if (typeof firebase === 'undefined') {
  document.body.innerHTML = '<div style="padding:30px">Firebaseを読み込めませんでした。ネット接続と、http(s)で開いているか確認してください。</div>';
  throw new Error('firebase not loaded');
}
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ===== 設定 =====
const W = 36, H = 26, C = 24;               // マップ幅・高さ・1マスのpx
const COST = { land: 30, air: 50, sea: 40 };
const NAME = { land: '陸軍', air: '空軍', sea: '海軍' };
const ICON = { land: '🪖', air: '✈️', sea: '🚢' };
const RANGE = { land: 1, sea: 3, air: 6 };
const BEATS = { air: 'land', land: 'sea', sea: 'air' };   // 左が右に有利
const COOLDOWN = 4000;

let myId = localStorage.getItem('umiNationId');
let nations = {}, tiles = {}, logs = [];
let sel = null, lastAtk = 0, loaded = false;

const me = () => nations[myId];
const expandCost = () => 8 + Math.floor((me()?.tiles || 0) * 0.5);

// ===== タブ =====
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('on', s.id === 's-' + b.dataset.tab));
  if (b.dataset.tab === 'map') draw();
});

// ===== 建国 =====
$('nGo').onclick = async () => {
  const name = $('nName').value.trim();
  if (!name) return toast('国名を入力してください');
  myId = 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  localStorage.setItem('umiNationId', myId);
  await db.ref('nations/' + myId).set({
    name, color: $('nColor').value, tiles: 0, gold: 60,
    units: { land: 1, air: 0, sea: 0 }, created: Date.now()
  });
  pushLog(`🏝️ 「${name}」が海の上に建国を宣言した!`);
  $('overlay').style.display = 'none';
};

// ===== DB購読 =====
db.ref('tiles').on('value', s => { tiles = s.val() || {}; draw(); renderPanel(); });
db.ref('nations').on('value', s => {
  nations = s.val() || {};
  loaded = true;
  $('overlay').style.display = (!myId || !nations[myId]) ? 'flex' : 'none';
  renderAll();
});
db.ref('logs').orderByChild('t').limitToLast(40).on('value', s => {
  logs = []; s.forEach(c => logs.push(c.val())); logs.reverse(); renderLog();
});
function pushLog(text){ db.ref('logs').push({ t: Date.now(), text }); }

// ===== 収入 =====
setInterval(() => {
  const n = me();
  if (n && n.tiles > 0) db.ref('nations/' + myId + '/gold').transaction(g => (g || 0) + 2 + n.tiles);
}, 3000);

// ===== 描画 =====
const cv = $('cv'), ctx = cv.getContext('2d');
cv.width = W * C; cv.height = H * C;

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    ctx.fillStyle = (x + y) % 2 ? '#0d5a94' : '#0b5089';
    ctx.fillRect(x * C, y * C, C, C);
    const o = tiles[x + '_' + y];
    if (o && nations[o]) {
      ctx.fillStyle = nations[o].color;
      ctx.globalAlpha = .85;
      ctx.fillRect(x * C + 1, y * C + 1, C - 2, C - 2);
      ctx.globalAlpha = 1;
      if (o === myId) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        ctx.strokeRect(x * C + 2, y * C + 2, C - 4, C - 4);
      }
    }
  }
  if (sel) {
    ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 3;
    ctx.strokeRect(sel.x * C + 1.5, sel.y * C + 1.5, C - 3, C - 3);
  }
}

cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * W);
  const y = Math.floor((e.clientY - r.top) / r.height * H);
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  sel = { x, y };
  const n = me();
  if (n && n.tiles <= 0 && !tiles[x + '_' + y]) { found(x, y); return; }
  draw(); renderPanel();
});

// ===== 位置ヘルパー =====
function myTiles() {
  const a = [];
  for (const k in tiles) if (tiles[k] === myId) { const [x, y] = k.split('_').map(Number); a.push({ x, y }); }
  return a;
}
function minDist(x, y) {
  let m = 99;
  for (const t of myTiles()) m = Math.min(m, Math.abs(t.x - x) + Math.abs(t.y - y));
  return m;
}

// ===== 建国(首都) =====
async function found(x, y) {
  const tr = await db.ref('tiles/' + x + '_' + y).transaction(c => c === null ? myId : undefined);
  if (!tr.committed) return toast('そのマスは他国の領土です');
  await db.ref('nations/' + myId + '/tiles').transaction(v => (v || 0) + 1);
  pushLog(`👑 ${me().name} が (${x},${y}) に首都を築いた`);
  toast('首都を建設しました!');
}

// ===== 領土拡張 =====
async function expand() {
  if (!sel) return;
  const { x, y } = sel, k = x + '_' + y, cost = expandCost();
  if (tiles[k]) return toast('すでに誰かの領土です');
  if (minDist(x, y) !== 1) return toast('自国に隣接するマスだけ拡張できます');
  const r = await db.ref('nations/' + myId).transaction(n => {
    if (!n || (n.gold || 0) < cost) return;
    n.gold -= cost; return n;
  });
  if (!r.committed) return toast('資金が足りません');
  const tr = await db.ref('tiles/' + k).transaction(c => c === null ? myId : undefined);
  if (tr.committed) {
    await db.ref('nations/' + myId + '/tiles').transaction(v => (v || 0) + 1);
    toast('領土を拡張しました');
  } else {
    db.ref('nations/' + myId + '/gold').transaction(g => (g || 0) + cost);
    toast('先に他国に取られました');
  }
}

// ===== 兵の購入 =====
async function buy(type) {
  const cost = COST[type];
  const r = await db.ref('nations/' + myId).transaction(n => {
    if (!n || (n.gold || 0) < cost) return;
    n.gold -= cost;
    n.units = n.units || { land: 0, air: 0, sea: 0 };
    n.units[type] = (n.units[type] || 0) + 1;
    return n;
  });
  toast(r.committed ? `${NAME[type]}を1部隊増強` : '資金が足りません');
}

// ===== 戦争 =====
function mult(d, t) { return BEATS[d] === t ? 1.5 : (BEATS[t] === d ? 0.6 : 1); }

async function attack(type) {
  if (!sel) return;
  const k = sel.x + '_' + sel.y, did = tiles[k], d = nations[did], a = me();
  if (!did || did === myId || !d) return;
  if (Date.now() - lastAtk < COOLDOWN) return toast('部隊が再編中です(数秒待って)');
  const dist = minDist(sel.x, sel.y);
  if (dist > RANGE[type]) return toast(`${NAME[type]}の射程外です(射程${RANGE[type]}マス)`);
  const committed = (a.units && a.units[type]) || 0;
  if (committed < 1) return toast(`${NAME[type]}がいません`);
  lastAtk = Date.now();

  const du = d.units || {};
  let def = 1;
  for (const t of ['land', 'air', 'sea']) def += (du[t] || 0) * mult(t, type);
  const atk = committed * (0.8 + Math.random() * 0.4);
  const win = atk > def;

  const aLoss = Math.max(1, Math.ceil(committed * (win ? 0.3 : 0.5)));
  const dRate = win ? 0.2 : 0.1;

  await db.ref('nations/' + myId + '/units/' + type).transaction(v => Math.max(0, (v || 0) - aLoss));
  await db.ref('nations/' + did).transaction(n => {
    if (!n) return;
    n.units = n.units || {};
    for (const t of ['land', 'air', 'sea']) n.units[t] = Math.floor((n.units[t] || 0) * (1 - dRate));
    if (win) n.tiles = Math.max(0, (n.tiles || 0) - 1);
    return n;
  });

  if (win) {
    await db.ref('tiles/' + k).set(myId);
    await db.ref('nations/' + myId + '/tiles').transaction(v => (v || 0) + 1);
    pushLog(`${ICON[type]} ${a.name} が ${d.name} の (${sel.x},${sel.y}) を${NAME[type]}で占領!`);
    toast(`勝利!領土を奪いました(損害:${aLoss})`);
    if ((d.tiles || 1) - 1 <= 0) pushLog(`💀 ${d.name} は全領土を失い滅亡した…`);
  } else {
    pushLog(`🛡️ ${d.name} が ${a.name} の${NAME[type]}による攻撃を撃退した`);
    toast(`敗北…(損害:${aLoss})`);
  }
}

// ===== UI =====
function renderPanel() {
  const p = $('panel'), n = me();
  if (!n) { p.textContent = '建国してください'; return; }
  if (n.tiles <= 0) { p.innerHTML = '<h3>👑 首都を決めよう</h3>海の空いているマスをタップすると首都になります(無料)。'; return; }
  if (!sel) { p.textContent = 'マスをタップして選択してください。'; return; }
  const k = sel.x + '_' + sel.y, o = tiles[k], on = nations[o];
  let h = `<h3>📍 (${sel.x}, ${sel.y})</h3>`;
  if (!o) {
    const adj = minDist(sel.x, sel.y) === 1;
    h += `どこの国でもない海です。<div class="btns"><button class="btn" ${adj ? '' : 'disabled'} onclick="expand()">🌊 領土にする(💰${expandCost()})</button></div>`;
    if (!adj) h += '<div class="hint">自国に隣接するマスだけ拡張できます。</div>';
  } else if (o === myId) {
    h += 'あなたの領土です。';
  } else {
    const d = minDist(sel.x, sel.y), u = n.units || {};
    h += `<b style="color:${on ? on.color : '#fff'}">${on ? esc(on.name) : '?'}</b> の領土(領土${on?.tiles || 0}/自国から距離${d})<div class="btns">`;
    for (const t of ['land', 'air', 'sea'])
      h += `<button class="btn ${t}" ${(d <= RANGE[t] && (u[t] || 0) > 0) ? '' : 'disabled'} onclick="attack('${t}')">${ICON[t]} ${NAME[t]}で攻撃(${u[t] || 0})</button>`;
    h += '</div>';
  }
  p.innerHTML = h;
}

function renderStats() {
  const n = me();
  $('stats').innerHTML = n
    ? `<span>${esc(n.name)}</span><span>領土 <b>${n.tiles || 0}</b></span><span>💰 <b>${n.gold || 0}</b></span><span>🪖${n.units?.land || 0} ✈️${n.units?.air || 0} 🚢${n.units?.sea || 0}</span>`
    : '';
  const b = $('banner');
  if (n && n.tiles <= 0) { b.style.display = 'block'; b.textContent = '👑 マップの空いている海をタップして首都を建設しよう!'; }
  else b.style.display = 'none';
}

function renderRank() {
  const list = Object.entries(nations).filter(([, n]) => (n.tiles || 0) > 0)
    .sort((a, b) => (b[1].tiles || 0) - (a[1].tiles || 0));
  const max = list.length ? list[0][1].tiles : 1;
  $('rankList').innerHTML = list.length ? list.map(([id, n], i) => `
    <div class="rank ${id === myId ? 'me' : ''}">
      <div class="no">${['🥇', '🥈', '🥉'][i] || (i + 1)}</div>
      <div class="dot" style="background:${n.color}"></div>
      <div class="nm">${esc(n.name)}${id === myId ? '(あなた)' : ''}
        <small>🪖${n.units?.land || 0} ✈️${n.units?.air || 0} 🚢${n.units?.sea || 0}</small>
        <div class="bar"><i style="width:${(n.tiles / max) * 100}%;background:${n.color}"></i></div></div>
      <div class="tl">${n.tiles}マス</div>
    </div>`).join('') : '<div class="hint">まだ国がありません。</div>';
}

function renderArmy() {
  const n = me(); if (!n) return;
  $('armyList').innerHTML = ['land', 'air', 'sea'].map(t => `
    <div class="unit"><div>${ICON[t]} <b>${NAME[t]}</b> × ${n.units?.[t] || 0}
      <div class="hint" style="margin:0">射程 ${RANGE[t]}マス</div></div>
      <button class="btn ${t}" onclick="buy('${t}')">増強 💰${COST[t]}</button></div>`).join('');
}

function renderLog() {
  $('logList').innerHTML = logs.length
    ? logs.map(l => `<div class="log"><small>${new Date(l.t).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}</small>${esc(l.text)}</div>`).join('')
    : '<div class="hint">まだ出来事がありません。</div>';
}

function renderAll() { renderStats(); renderRank(); renderArmy(); renderPanel(); draw(); }
window.expand = expand; window.attack = attack; window.buy = buy;
</script>
</body>
</html>
