<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ブロックキャノン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d22; --panel:rgba(18,20,46,.86); --ink:#f5f6ff; --ink-dim:#9ea4d4;
  --hot:#ff8a1f; --hot2:#ffcf3f; --cyan:#31e3ff; --pink:#ff3d81; --line:rgba(255,255,255,.14);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
}
/* ゲームは常に夜空の暗い世界観。ライト/ダークどちらの設定でも同じ配色を使う */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b0d22; --panel:rgba(18,20,46,.86); --ink:#f5f6ff; --ink-dim:#9ea4d4; } }
:root[data-theme="dark"]{ --bg:#0b0d22; --panel:rgba(18,20,46,.86); --ink:#f5f6ff; --ink-dim:#9ea4d4; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:var(--bg)}

/* HUD */
#hud{display:flex;align-items:center;gap:8px;padding:8px 10px 6px}
.stat{min-width:54px}
.stat.right{text-align:right}
.lbl{font-size:10px;font-weight:700;color:var(--ink-dim);letter-spacing:.04em}
.val{font-size:26px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--hot2);text-shadow:0 0 12px rgba(255,180,50,.45)}
#best.val{font-size:20px;color:var(--ink);text-shadow:none}
.val.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.mid{flex:1;text-align:center;min-width:0}
#shots{display:flex;justify-content:center;gap:3px;margin-bottom:3px}
.dot{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#ffc44d 40%,#e8590c 100%);box-shadow:0 0 6px rgba(255,140,30,.7);transition:opacity .25s,filter .25s,transform .25s}
.dot.off{opacity:.16;filter:grayscale(1);box-shadow:none;transform:scale(.7)}
.btns{display:flex;gap:6px}
.ico{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:16px;padding:0;display:grid;place-items:center}
.ico:active{background:rgba(255,255,255,.18)}

/* Stage */
#stage{position:relative;flex:1 1 0;min-height:0;overflow:hidden}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none;border-radius:12px;box-shadow:0 0 0 1px var(--line),0 12px 40px rgba(0,0,0,.5)}
#hint{text-align:center;font-size:11px;color:var(--ink-dim);padding:5px 8px 2px}

/* Controls */
#controls{display:flex;gap:10px;padding:6px 12px 12px;align-items:stretch}
.rot{flex:0 0 64px;height:58px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-size:22px;touch-action:none}
.rot:active,.rot.on{background:rgba(49,227,255,.25);border-color:var(--cyan)}
#btnFire{flex:1;height:58px;border-radius:18px;border:0;font-size:22px;font-weight:900;letter-spacing:.06em;color:#3b1300;
  background:linear-gradient(180deg,#ffe27a 0,#ffab2e 55%,#ff7a12 100%);box-shadow:0 5px 0 #b4470a,0 10px 24px rgba(255,120,20,.4);touch-action:none;transition:transform .06s,box-shadow .06s}
#btnFire.hold{transform:translateY(4px);box-shadow:0 1px 0 #b4470a,0 4px 12px rgba(255,120,20,.3)}
#btnFire .b{display:none;font-size:13px;letter-spacing:0}
.longpress #btnFire .a{display:none}
.longpress #btnFire .b{display:inline}
.longpress #btnFire{filter:saturate(.35) brightness(.85)}

/* Overlays */
.overlay{position:absolute;inset:0;display:none;background:rgba(6,7,20,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:auto;padding:16px;z-index:10}
.overlay.show{display:flex}
.card{margin:auto;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
h1{margin:0;font-size:38px;font-weight:900;line-height:1.05;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff6c2 0,#ffb42e 55%,#ff5d1f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(120,40,0,.8))}
.sub{margin:0;font-size:13px;color:var(--ink-dim);line-height:1.6}
.prevwrap{width:190px;height:190px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px var(--line),0 10px 30px rgba(0,0,0,.6);flex:0 0 auto}
#prev{width:100%;height:100%;display:block}
#thumbs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.th{width:52px;height:52px;padding:0;border-radius:10px;border:2px solid transparent;overflow:hidden;background:#000}
.th canvas{width:100%;height:100%;display:block}
.th.sel{border-color:var(--hot2);box-shadow:0 0 12px rgba(255,207,63,.6)}
.btn{display:block;width:100%;border-radius:16px;padding:14px 16px;font-size:16px;font-weight:800;border:1px solid var(--line);background:rgba(255,255,255,.08);text-align:center}
.btn.primary{border:0;color:#3b1300;font-size:20px;font-weight:900;background:linear-gradient(180deg,#ffe27a 0,#ffab2e 55%,#ff7a12 100%);box-shadow:0 5px 0 #b4470a,0 10px 24px rgba(255,120,20,.4)}
.btn.primary:active{transform:translateY(4px);box-shadow:0 1px 0 #b4470a}
.btn.link{background:none;border:0;color:var(--ink-dim);font-size:13px;padding:6px}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%}
.lg{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--ink-dim);line-height:1.25}
.lg canvas{width:36px;height:36px;border-radius:6px}
.lg b{color:var(--ink);font-size:11px}
.rlabel{font-size:14px;font-weight:800;color:var(--ink-dim)}
.rank{font-size:96px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff6c2,#ffae2e 60%,#ff4d1f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(120,40,0,.8));animation:rankIn .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes rankIn{0%{transform:scale(3) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.rscore{font-size:54px;font-weight:900;color:var(--hot2);line-height:1;text-shadow:0 0 18px rgba(255,180,50,.5)}
.rscore small{display:block;font-size:13px;color:var(--ink-dim);font-weight:700;margin-top:4px;text-shadow:none}
.rbest{font-size:14px;font-weight:800;min-height:20px;color:var(--cyan)}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:12px;font-size:13px;z-index:20}
@media (prefers-reduced-motion: reduce){ .rank,.val.pop{animation:none} }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="stat"><div class="lbl">破壊</div><div id="score" class="val">0</div></div>
    <div class="mid"><div id="shots"></div><div class="lbl" id="shotlbl">のこり10発</div></div>
    <div class="stat right"><div class="lbl">ベスト</div><div id="best" class="val">0</div></div>
    <div class="btns">
      <button id="btnSound" class="ico" aria-label="サウンド切り替え">🔊</button>
      <button id="btnMenu" class="ico" aria-label="画像を選ぶ">🖼️</button>
    </div>
  </header>

  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="hint">ドラッグで狙う ／ タップで発射 ／ 長押しは発射しません</div>
  <footer id="controls">
    <button id="btnL" class="rot" aria-label="左へ">◀</button>
    <button id="btnFire"><span class="a">発射！</span><span class="b">長押し中は発射しません</span></button>
    <button id="btnR" class="rot" aria-label="右へ">▶</button>
  </footer>

  <div id="menu" class="overlay show">
    <div class="card">
      <h1>ブロック<br>キャノン</h1>
      <p class="sub">10発で、何ブロック壊せる？<br>好きな画像をブロックにして撃ち抜こう</p>
      <div class="prevwrap"><canvas id="prev" width="360" height="360"></canvas></div>
      <div id="thumbs"></div>
      <label class="btn" for="file">📷 じぶんの画像を選ぶ</label>
      <input id="file" type="file" accept="image/*" hidden>
      <div class="legend" id="legend"></div>
      <button id="btnStart" class="btn primary">スタート</button>
      <button id="btnClose" class="btn link" hidden>とじて ゲームにもどる</button>
    </div>
  </div>

  <div id="result" class="overlay">
    <div class="card">
      <div class="rlabel">リザルト</div>
      <div id="rrank" class="rank">A</div>
      <div class="rscore"><span id="rscore">0</span><small>ブロック破壊</small></div>
      <div id="rbest" class="rbest"></div>
      <button id="btnRetry" class="btn primary">もう一回！</button>
      <button id="btnImg" class="btn">画像をかえる</button>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
</div>

<script>
(() => {
'use strict';

/* ================= 定数 ================= */
const COLS = 18, ROWS = 18, CELL = 20, IS = 2;           // IS: 画像の解像度倍率
const W = COLS * CELL, H = 560, GRID_TOP = 14;
const PIVOT = { x: W / 2, y: H - 54 };
const BARREL = 44, BALL_R = 6, SPEED = 980;
const MAX_ANG = Math.PI * 0.44, MAX_SHOTS = 10, LONG_MS = 320, MAX_BOUNCE = 4;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

const cv = $('cv'), ctx = cv.getContext('2d');
let vs = 1, dpr = 1;               // canvas px / logical unit
let baseM = [1, 0, 0, 1, 0, 0];    // 現在の基本変換

/* ================= サウンド (WebAudio合成) ================= */
const Snd = (() => {
  let ac = null, master = null, rvIn = null, nbuf = null, muted = false, lastBrk = 0;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 18; comp.ratio.value = 10; comp.attack.value = .002; comp.release.value = .22;
      master = ac.createGain(); master.gain.value = muted ? 0 : .85;
      master.connect(comp); comp.connect(ac.destination);
      const len = ac.sampleRate * 2;
      nbuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = nbuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const conv = ac.createConvolver();
      const rl = Math.floor(ac.sampleRate * 1.3);
      const ib = ac.createBuffer(2, rl, ac.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const dd = ib.getChannelData(ch);
        for (let i = 0; i < rl; i++) dd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / rl, 2.6);
      }
      conv.buffer = ib;
      rvIn = ac.createGain(); rvIn.gain.value = .35; rvIn.connect(conv);
      const wet = ac.createGain(); wet.gain.value = .55; conv.connect(wet); wet.connect(comp);
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  const ok = () => ac && !muted;
  function env(g, t, a, d, peak) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(type, f1, f2, dur, vol, delay = 0, rv = false) {
    if (!ok()) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    env(g, t, .004, dur, vol);
    o.connect(g); g.connect(master); if (rv && rvIn) g.connect(rvIn);
    o.start(t); o.stop(t + dur + .06);
  }
  function noise(dur, vol, ftype, f1, f2, q = 1, delay = 0, rv = false) {
    if (!ok() || !nbuf) return;
    const t = ac.currentTime + delay;
    const s = ac.createBufferSource(); s.buffer = nbuf;
    const fl = ac.createBiquadFilter(); fl.type = ftype; fl.Q.value = q;
    fl.frequency.setValueAtTime(f1, t);
    if (f2 !== f1) fl.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    const g = ac.createGain(); env(g, t, .003, dur, vol);
    s.connect(fl); fl.connect(g); g.connect(master); if (rv && rvIn) g.connect(rvIn);
    s.start(t, Math.random() * .6); s.stop(t + dur + .06);
  }
  const boom = () => {
    noise(.9, 1, 'lowpass', 2200, 50, .8, 0, true);
    tone('sine', 120, 28, .8, 1.0);
    tone('triangle', 240, 40, .5, .4);
  };
  return {
    init,
    toggle() { muted = !muted; if (master) master.gain.value = muted ? 0 : .85; return muted; },
    isMuted: () => muted,
    fire() {
      noise(.3, .9, 'lowpass', 2600, 200, .7, 0, true);
      tone('sine', 190, 42, .34, 1.0);
      tone('sawtooth', 520, 90, .14, .25);
      noise(.06, .5, 'highpass', 3000, 3000);
    },
    hit() { noise(.16, .7, 'bandpass', 1800, 300, 1); tone('square', 320, 70, .14, .3); tone('sine', 150, 50, .2, .6); },
    brk(n) {
      if (!ok()) return;
      const now = ac.currentTime;
      if (now - lastBrk < .016) return;
      lastBrk = now;
      const i = n < 15 ? n : 10 + (n % 5);
      const off = [0, 2, 4, 7, 9];
      const semi = off[i % 5] + 12 * Math.floor(i / 5);
      const f = 330 * Math.pow(2, semi / 12);
      tone('triangle', f, f * 1.02, .17, .17);
      tone('sine', f * 2, f * 2, .09, .06);
      noise(.05, .22, 'highpass', 2500, 4000, 1);
      if (n % 3 === 0) tone('square', f / 2, f / 4, .1, .07);
    },
    boom,
    zap() { tone('sawtooth', 180, 2600, .22, .24); noise(.22, .4, 'highpass', 1500, 6000); tone('square', 2400, 600, .18, .1, .1); },
    bolt() { noise(.09, .5, 'bandpass', rnd(3000, 6000), 900, 3); tone('square', rnd(1400, 2300), 300, .07, .14); },
    mega() {
      boom();
      noise(1.3, 1, 'lowpass', 3200, 40, .6, .05, true);
      tone('sine', 70, 20, 1.2, 1.2);
      noise(.5, .5, 'highpass', 2500, 500, 1, .35, true);
      tone('sawtooth', 90, 900, .5, .16);
    },
    land() { tone('sine', 95, 45, .13, .38); noise(.07, .22, 'lowpass', 900, 150, 1); },
    ping() { tone('triangle', rnd(850, 1000), 1300, .09, .15); },
    ready() { tone('square', 880, 880, .04, .05); tone('square', 1320, 1320, .05, .05, .05); },
    ui() { tone('triangle', 700, 1100, .06, .2); },
    fanfare(lv) {
      const notes = [523, 659, 784, 1047, 1319, 1568];
      const n = Math.min(3 + lv, 6);
      for (let i = 0; i < n; i++) {
        tone('triangle', notes[i], notes[i], .18, .22, i * .07, true);
        tone('square', notes[i] * 2, notes[i] * 2, .08, .05, i * .07);
      }
      if (lv >= 3) { noise(.5, .4, 'highpass', 4000, 9000, 1, .2, true); }
    },
    result(hi) {
      const notes = hi ? [523, 659, 784, 1047, 784, 1047, 1319] : [392, 494, 587, 784];
      notes.forEach((n, i) => { tone('triangle', n, n, .22, .24, i * .11, true); tone('sine', n / 2, n / 2, .2, .1, i * .11); });
    }
  };
})();
const vibe = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* ================= 画像 ================= */
let img = null;                 // 720x720 のオフスクリーン
let tileColors = [];            // [r][c] = 'rgb(...)'
const bevel = document.createElement('canvas'); bevel.width = bevel.height = CELL * IS;
(() => {
  const g = bevel.getContext('2d'), s = CELL * IS, t = 2.4;
  g.fillStyle = 'rgba(255,255,255,.30)'; g.fillRect(0, 0, s, t); g.fillRect(0, 0, t, s);
  g.fillStyle = 'rgba(0,0,0,.34)'; g.fillRect(0, s - t, s, t); g.fillRect(s - t, 0, t, s);
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1; g.strokeRect(.5, .5, s - 1, s - 1);
})();

function setImageFrom(src, w, h) {
  const S = COLS * CELL * IS;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  const s = Math.min(w, h);
  g.drawImage(src, (w - s) / 2, (h - s) / 2, s, s, 0, 0, S, S);
  img = c;
  tileColors = [];
  try {
    const t = document.createElement('canvas'); t.width = COLS; t.height = ROWS;
    const tg = t.getContext('2d'); tg.imageSmoothingQuality = 'high';
    tg.drawImage(c, 0, 0, COLS, ROWS);
    const d = tg.getImageData(0, 0, COLS, ROWS).data;
    for (let r = 0; r < ROWS; r++) { tileColors[r] = []; for (let cc = 0; cc < COLS; cc++) { const i = (r * COLS + cc) * 4; tileColors[r][cc] = `rgb(${d[i]},${d[i + 1]},${d[i + 2]})`; } }
  } catch (e) {
    for (let r = 0; r < ROWS; r++) { tileColors[r] = []; for (let cc = 0; cc < COLS; cc++) tileColors[r][cc] = '#ccc'; }
  }
  drawPreview();
}

/* --- サンプル画像(コードで描画) --- */
function paintSunset(g) {
  let gr = g.createLinearGradient(0, 0, 0, 240);
  gr.addColorStop(0, '#1a1450'); gr.addColorStop(.38, '#7a3fa0'); gr.addColorStop(.7, '#ff6b6b'); gr.addColorStop(1, '#ffd56b');
  g.fillStyle = gr; g.fillRect(0, 0, 360, 240);
  g.fillStyle = 'rgba(255,255,255,.85)';
  for (let i = 0; i < 40; i++) g.fillRect((i * 97) % 360, (i * 53) % 110, 1.7, 1.7);
  gr = g.createRadialGradient(180, 225, 10, 180, 225, 150);
  gr.addColorStop(0, 'rgba(255,250,200,1)'); gr.addColorStop(.3, 'rgba(255,200,110,.7)'); gr.addColorStop(1, 'rgba(255,120,80,0)');
  g.fillStyle = gr; g.fillRect(0, 60, 360, 200);
  g.fillStyle = '#fff6c8'; g.beginPath(); g.arc(180, 222, 46, 0, TAU); g.fill();
  g.fillStyle = 'rgba(130,50,120,.55)';
  [[70, 130, 50, 8], [110, 142, 40, 6], [290, 118, 56, 9], [250, 132, 40, 6]].forEach(([x, y, rx, ry]) => { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fill(); });
  g.fillStyle = '#2b1747';
  g.beginPath(); g.moveTo(0, 242); g.lineTo(0, 205); g.lineTo(50, 178); g.lineTo(95, 212); g.lineTo(150, 190); g.lineTo(205, 242); g.fill();
  g.beginPath(); g.moveTo(360, 242); g.lineTo(360, 196); g.lineTo(300, 168); g.lineTo(250, 214); g.lineTo(212, 242); g.fill();
  gr = g.createLinearGradient(0, 240, 0, 360);
  gr.addColorStop(0, '#ff9a5c'); gr.addColorStop(.3, '#d24d6b'); gr.addColorStop(1, '#1e1846');
  g.fillStyle = gr; g.fillRect(0, 240, 360, 120);
  for (let i = 0; i < 12; i++) { const w = (90 - i * 6) * (1 + ((i * 37) % 5) / 10); g.fillStyle = `rgba(255,244,180,${.75 - i * .055})`; g.fillRect(180 - w / 2, 246 + i * 9, w, 3.2); }
  g.strokeStyle = '#2b1747'; g.lineWidth = 2.4; g.lineCap = 'round';
  [[70, 82], [98, 66], [124, 92]].forEach(([x, y]) => { g.beginPath(); g.moveTo(x - 10, y); g.quadraticCurveTo(x - 5, y - 8, x, y); g.quadraticCurveTo(x + 5, y - 8, x + 10, y); g.stroke(); });
}
function paintSmile(g) {
  g.fillStyle = '#2f22b8'; g.fillRect(0, 0, 360, 360);
  g.save(); g.translate(180, 180); g.fillStyle = '#5a3dff';
  for (let i = 0; i < 20; i++) { g.rotate(TAU / 20); g.beginPath(); g.moveTo(0, 0); g.lineTo(420, -42); g.lineTo(420, 42); g.fill(); }
  g.restore();
  let gr = g.createRadialGradient(150, 150, 10, 180, 190, 140);
  gr.addColorStop(0, '#fff7a1'); gr.addColorStop(.6, '#ffd21f'); gr.addColorStop(1, '#ff9f1c');

/* ================= ゲーム状態 ================= */

function schedule(delay, fn) { sched.push({ t: time + delay, fn }); }

}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

  const cells = [];

  shuffle(cells);
  const types = {};

  [[5, 2], [1, 11], [4, 8], [2, 5], [3, 5]].forEach(([t, n]) => { for (let i = 0; i < n; i++) types[cells[k][0] * COLS + cells[k++][1]] = t; });

    b.vy += 3400 * dt; b.y += b.vy * dt;

function addBolt(x1, y1, x2, y2) {
  const dist = Math.hypot(x2 - x1, y2 - y1), n = Math.max(4, (dist / 14) | 0), nx = -(y2 - y1) / dist, ny = (x2 - x1) / dist;

/* ================= 破壊ロジック ================= */
function destroyAt(r, c, delay, ox, oy, pre) {

}

/* ================= 発射・弾 ================= */

  recoil = 1; muzzle = 1; addShake(6); Snd.fire(); vibe(18);
  sparks(ball.x, ball.y, 14, 380, ['#fff', '#ffd166', '#ff8c42'], 3, .35);
}
function updateBall(dt) {
  const b = ball; if (!b) return;
  const steps = Math.max(1, Math.ceil(SPEED * dt / 3)), sd = dt / steps;
  for (let i = 0; i < steps; i++) {
    b.x += b.vx * sd; b.y += b.vy * sd;
    let bounced = false;
    if (b.x < BALL_R) { b.x = BALL_R; b.vx = Math.abs(b.vx); bounced = true; }
    else if (b.x > W - BALL_R) { b.x = W - BALL_R; b.vx = -Math.abs(b.vx); bounced = true; }
    if (b.y < BALL_R) { b.y = BALL_R; b.vy = Math.abs(b.vy); bounced = true; }
    if (bounced) {
      b.bounces++; Snd.ping(); sparks(b.x, b.y, 6, 220, ['#fff', '#9fd8ff'], 2.4, .3);
      if (b.bounces > MAX_BOUNCE) { fizzle(); return; }
    }
    if (b.y > H + 10) { fizzle(); return; }
    const sp = Math.hypot(b.vx, b.vy), lx = b.x + b.vx / sp * 5, ly = b.y + b.vy / sp * 5;
    const c = Math.floor(lx / CELL), r = Math.floor((ly - GRID_TOP) / CELL);

}

function settle() {
  const n = shotCount; shotCount = 0;
  let lv = 0, txt = '';
  if (n >= 120) { lv = 5; txt = 'PERFECT!!'; } else if (n >= 80) { lv = 4; txt = 'AMAZING!!'; } else if (n >= 50) { lv = 3; txt = 'EXCELLENT!'; }
  else if (n >= 30) { lv = 2; txt = 'GREAT!'; } else if (n >= 15) { lv = 1; txt = 'NICE!'; }
  if (n === 0) popup('MISS…', W / 2, 210, 30, '#9aa3d6', 1);
  else if (lv > 0) {
    popup(txt, W / 2, 180, [0, 38, 44, 50, 54, 58][lv], lv === 5 ? 'rainbow' : ['', '#ffe066', '#ffb02e', '#ff6fa8', '#5ff0ff'][lv], 1.5);
    popup('+' + n, W / 2, 226, 28, '#ffffff', 1.4);
    Snd.fanfare(lv);
    if (lv >= 3) { confetti(W / 2, 200, 40 + lv * 14); flash(.22, '#fff'); vibe([30, 30, 60]); }
  }
  if (remain === 0) {
    state = 'clearwait';
    popup('ALL CLEAR!!', W / 2, 120, 46, '#7dffb3', 1.9);
    Snd.fanfare(5); confetti(60, 240, 50); confetti(W - 60, 240, 50); flash(.3, '#7dffb3');

/* ================= 更新 ================= */
function update(dt, rdt) {
  const rot = rotBtn || rotKey;
  if (rot) aim = Math.max(-MAX_ANG, Math.min(MAX_ANG, aim + rot * rdt * 1.5));
  time += dt;
  updateFall(dt);
  if (ball) updateBall(dt);
  runSched();
  if (state === 'resolving' && !ball && sched.length === 0) settle();

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life >= p.max) { particles[i] = particles[particles.length - 1]; particles.pop(); continue; }
    p.vy += (p.k === 1 ? 420 : p.k === 3 ? 500 : 1200) * dt;
    const drag = 1 - (p.k === 3 ? 2.2 : 1.1) * dt;
    p.vx *= drag; if (p.k === 3) p.vy *= drag;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.k !== 1) p.rot += p.vr * dt;
  }
  for (const arr of [popups, rings, beams, bolts]) for (let i = arr.length - 1; i >= 0; i--) { arr[i].age += dt; if (arr[i].age >= arr[i].max) arr.splice(i, 1); }
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const b = grid[r] && grid[r][c]; if (b && b.squash > 0) b.squash = Math.max(0, b.squash - dt * 7); }
  recoil = Math.max(0, recoil - rdt * 5); muzzle = Math.max(0, muzzle - rdt * 9);
  shake *= Math.exp(-9 * rdt); if (shake < .05) shake = 0;
  flashA = Math.max(0, flashA - rdt * 2.6);

}

  g.save();

    g.beginPath(); g.arc(-s * .02, s * .07, s * .27, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.arc(-s * .11, -s * .01, s * .06, 0, TAU); g.fill();
    g.strokeStyle = '#eadca6'; g.lineWidth = s * .08;

}

function drawBlock(b, t) {
  const x = b.x;
  let h = CELL, yy = b.y;
  if (b.squash > 0) { h = CELL * (1 - .24 * b.squash); yy = b.y + CELL - h; }
  ctx.drawImage(img, b.c * IS * CELL, b.r * IS * CELL, IS * CELL, IS * CELL, x, yy, CELL, h);
  ctx.drawImage(bevel, x, yy, CELL, h);
  if (b.type) drawSpecial(ctx, b.type, x, yy, CELL, t);
  if (b.marked) { ctx.fillStyle = `rgba(255,255,255,${.4 + .25 * Math.sin(t * 50 + b.ph)})`; ctx.fillRect(x, yy, CELL, h); }
}

function computeGuide() {
  const pts = []; let x = PIVOT.x + Math.sin(aim) * BARREL, y = PIVOT.y - Math.cos(aim) * BARREL, vx = Math.sin(aim), vy = -Math.cos(aim), hit = null, bn = 0;
  pts.push({ x, y });
  for (let i = 0; i < 1000; i++) {
    x += vx * 3; y += vy * 3;
    let bo = false;
    if (x < BALL_R) { x = BALL_R; vx = Math.abs(vx); bo = true; } else if (x > W - BALL_R) { x = W - BALL_R; vx = -Math.abs(vx); bo = true; }
    if (y < BALL_R) { y = BALL_R; vy = Math.abs(vy); bo = true; }
    if (bo) { pts.push({ x, y }); if (++bn > 2) break; }
    if (y > H) break;
    const c = Math.floor((x + vx * 5) / CELL), r = Math.floor((y + vy * 5 - GRID_TOP) / CELL);
    if (r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c]) { hit = { x, y, r, c }; break; }
  }
  pts.push({ x, y });
  return { pts, hit };
}

function drawCannon(t) {
  const { x, y } = PIVOT;
  ctx.fillStyle = '#191b3a'; ctx.strokeStyle = '#4b52a3'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - 76, H + 4); ctx.lineTo(x - 56, y + 16); ctx.lineTo(x + 56, y + 16); ctx.lineTo(x + 76, H + 4); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.translate(x, y); ctx.rotate(aim);
  const rc = recoil * 13;
  const bg = ctx.createLinearGradient(-11, 0, 11, 0);
  bg.addColorStop(0, '#30355a'); bg.addColorStop(.35, '#d3d7f2'); bg.addColorStop(.62, '#7d83ad'); bg.addColorStop(1, '#25294a');
  ctx.fillStyle = bg; ctx.strokeStyle = '#141633'; ctx.lineWidth = 1.5;
  ctx.fillRect(-10, -BARREL + rc, 20, BARREL + 6); ctx.strokeRect(-10, -BARREL + rc, 20, BARREL + 6);
  ctx.fillStyle = bg; ctx.fillRect(-13, -BARREL - 3 + rc, 26, 10); ctx.strokeRect(-13, -BARREL - 3 + rc, 26, 10);
  ctx.fillStyle = '#ff8a1f'; ctx.fillRect(-10, -BARREL + 12 + rc, 20, 4);
  if (muzzle > 0) {

    const mg = ctx.createRadialGradient(0, -BARREL - 8 + rc, 1, 0, -BARREL - 8 + rc, 34 * muzzle + 6);
    mg.addColorStop(0, 'rgba(255,240,180,1)'); mg.addColorStop(.4, 'rgba(255,150,40,.7)'); mg.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(0, -BARREL - 8 + rc, 34 * muzzle + 6, 0, TAU); ctx.fill();

  }
  ctx.restore();

    ctx.fillStyle = '#23264d'; ctx.strokeStyle = '#6a72c4'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x + dx, y + 22, 15, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#3a3f7c'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + dx - 12, y + 22); ctx.lineTo(x + dx + 12, y + 22); ctx.moveTo(x + dx, y + 10); ctx.lineTo(x + dx, y + 34); ctx.stroke();
  });

  hg.addColorStop(0, '#dfe3ff'); hg.addColorStop(.5, '#7a80b0'); hg.addColorStop(1, '#2a2e57');
  ctx.fillStyle = hg; ctx.strokeStyle = '#141633'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 21, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ff8a1f'; ctx.beginPath(); ctx.arc(x, y, 7, 0, TAU); ctx.fill();

}

function drawGuide(t) {
  const g = computeGuide();
  const longHold = (down && performance.now() - down.t > LONG_MS) || (fireDown && performance.now() - fireDown.t > LONG_MS);
  const col = longHold ? '49,227,255' : '255,236,150';
  ctx.save();
  ctx.setLineDash([5, 9]); ctx.lineDashOffset = -t * 50; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.strokeStyle = `rgba(${col},.85)`;
  ctx.beginPath(); g.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
  ctx.setLineDash([]);
  if (g.hit) {
    ctx.fillStyle = `rgba(${col},.13)`; ctx.strokeStyle = `rgba(${col},.55)`; ctx.lineWidth = 1.5;
    const gx = Math.max(0, g.hit.c - 1) * CELL, gy = GRID_TOP + Math.max(0, g.hit.r - 1) * CELL;
    const gw = (Math.min(COLS - 1, g.hit.c + 1) - Math.max(0, g.hit.c - 1) + 1) * CELL, gh = (Math.min(ROWS - 1, g.hit.r + 1) - Math.max(0, g.hit.r - 1) + 1) * CELL;
    ctx.fillRect(gx, gy, gw, gh); ctx.strokeRect(gx, gy, gw, gh);

    ctx.strokeStyle = `rgba(${col},.95)`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(g.hit.x, g.hit.y, pr, 0, TAU); ctx.moveTo(g.hit.x - pr - 4, g.hit.y); ctx.lineTo(g.hit.x + pr + 4, g.hit.y); ctx.moveTo(g.hit.x, g.hit.y - pr - 4); ctx.lineTo(g.hit.x, g.hit.y + pr + 4); ctx.stroke();
  }
  ctx.restore();
}

function drawBall() {
  const b = ball;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < b.trail.length; i++) {
    const p = b.trail[i], k = (i + 1) / b.trail.length;
    ctx.fillStyle = `rgba(255,${(120 + k * 80) | 0},50,${k * .38})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, BALL_R * k * 1.15, 0, TAU); ctx.fill();
  }
  const gl = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, 22);
  gl.addColorStop(0, 'rgba(255,200,90,.85)'); gl.addColorStop(1, 'rgba(255,120,30,0)');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(b.x, b.y, 22, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  const sg = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, BALL_R + 1);
  sg.addColorStop(0, '#fff'); sg.addColorStop(.4, '#ffb347'); sg.addColorStop(1, '#c2410c');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, TAU); ctx.fill();
}

const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

function draw(t) {
  const sx = (Math.random() - .5) * shake * 2, sy = (Math.random() - .5) * shake * 2;
  baseM = [vs, 0, 0, vs, sx * vs, sy * vs];
  ctx.setTransform(vs, 0, 0, vs, sx * vs, sy * vs);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // 背景
  if (!bgGrad) { bgGrad = ctx.createLinearGradient(0, 0, 0, H); bgGrad.addColorStop(0, '#0e1030'); bgGrad.addColorStop(.6, '#1a1240'); bgGrad.addColorStop(1, '#241247'); }
  ctx.fillStyle = bgGrad; ctx.fillRect(-30, -30, W + 60, H + 60);
  ctx.fillStyle = '#fff';
  for (const s of stars) { ctx.globalAlpha = .25 + .5 * (.5 + .5 * Math.sin(t * 2 + s.p)); ctx.fillRect(s.x, s.y, s.r, s.r); }
  ctx.globalAlpha = 1;
  // ボード背景
  ctx.fillStyle = 'rgba(0,0,0,.38)'; ctx.fillRect(0, GRID_TOP - 2, W, ROWS * CELL + 4);
  ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i <= COLS; i++) { ctx.moveTo(i * CELL, GRID_TOP); ctx.lineTo(i * CELL, GRID_TOP + ROWS * CELL); }
  for (let i = 0; i <= ROWS; i++) { ctx.moveTo(0, GRID_TOP + i * CELL); ctx.lineTo(W, GRID_TOP + i * CELL); }
  ctx.stroke();
  // 床
  const fg = ctx.createLinearGradient(0, H - 100, 0, H); fg.addColorStop(0, 'rgba(74,82,163,.0)'); fg.addColorStop(1, 'rgba(74,82,163,.35)');
  ctx.fillStyle = fg; ctx.fillRect(0, H - 100, W, 100);

  // ブロック
  if (img) for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const b = grid[r] && grid[r][c]; if (b && b.y > -CELL) drawBlock(b, t); }

  // ビーム
  ctx.globalCompositeOperation = 'lighter';
  for (const bm of beams) {
    const k = bm.age / bm.max, ex = Math.min(1, bm.age / .3) * (bm.k === 'h' ? W : H + 40), th = (1 - k) * 26 + 2;
    ctx.globalAlpha = 1 - k * .6; ctx.fillStyle = bm.col;
    if (bm.k === 'h') { ctx.fillRect(bm.ox - ex, bm.oy - th / 2, ex * 2, th); ctx.fillStyle = '#fff'; ctx.fillRect(bm.ox - ex, bm.oy - th / 6, ex * 2, th / 3); }
    else { ctx.fillRect(bm.ox - th / 2, bm.oy - ex, th, ex * 2); ctx.fillStyle = '#fff'; ctx.fillRect(bm.ox - th / 6, bm.oy - ex, th / 3, ex * 2); }
  }
  ctx.globalAlpha = 1;
  // リング
  for (const r of rings) {
    const k = r.age / r.max, e = 1 - Math.pow(1 - k, 3), rad = r.r0 + (r.r1 - r.r0) * e;
    ctx.globalAlpha = 1 - k;
    if (r.fill) { const g = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, rad); g.addColorStop(0, 'rgba(255,255,220,.9)'); g.addColorStop(.5, r.color); g.addColorStop(1, 'rgba(255,80,20,0)'); ctx.fillStyle = g; ctx.globalAlpha = (1 - k) * .75; ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.fill(); ctx.globalAlpha = 1 - k; }
    ctx.strokeStyle = r.color; ctx.lineWidth = r.lw * (1 - k) + .5;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // 雷
  for (const bo of bolts) {
    const k = bo.age / bo.max; ctx.globalAlpha = (1 - k) * (.7 + .3 * Math.random());
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,240,90,.6)'; ctx.lineWidth = 7; ctx.beginPath(); bo.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2; ctx.beginPath(); bo.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // パーティクル（破片 → 火花 → 紙吹雪）
  for (const p of particles) {
    if (p.k === 0) {
      const a = 1 - Math.max(0, (p.life / p.max - .6) / .4), c = Math.cos(p.rot), s = Math.sin(p.rot);
      ctx.globalAlpha = a;
      ctx.setTransform(vs * c, vs * s, -vs * s, vs * c, vs * p.x + baseM[4], vs * p.y + baseM[5]);
      ctx.drawImage(img, p.sx, p.sy, IS * CELL / 2, IS * CELL / 2, -p.size / 2, -p.size / 2, p.size, p.size);
    }
  }
  ctx.setTransform(baseM[0], 0, 0, baseM[3], baseM[4], baseM[5]);
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    if (p.k === 1) { ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const p of particles) {
    if (p.k === 3) {
      const c = Math.cos(p.rot), s = Math.sin(p.rot);
      ctx.globalAlpha = 1 - Math.max(0, (p.life / p.max - .7) / .3);
      ctx.setTransform(vs * c, vs * s, -vs * s, vs * c, vs * p.x + baseM[4], vs * p.y + baseM[5]);
      ctx.fillStyle = p.col; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    }
  }
  ctx.setTransform(baseM[0], 0, 0, baseM[3], baseM[4], baseM[5]); ctx.globalAlpha = 1;

  if (state === 'ready') drawGuide(t);
  if (ball) drawBall();
  drawCannon(t);

  // コンボ表示
  if (comboN >= 3 && comboT < 1.7) {
    const fade = comboT > 1.2 ? 1 - (comboT - 1.2) / .5 : 1, sc = 1 + comboPulse * .35;
    ctx.save(); ctx.globalAlpha = fade; ctx.translate(W - 14, 400); ctx.scale(sc, sc); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.font = '900 44px "M PLUS Rounded 1c",system-ui,sans-serif'; ctx.lineWidth = 7; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(70,20,0,.9)';
    ctx.strokeText(comboN, 0, 0); ctx.fillStyle = '#ffdc5e'; ctx.fillText(comboN, 0, 0);
    ctx.font = '900 16px "M PLUS Rounded 1c",system-ui,sans-serif'; ctx.lineWidth = 4;
    ctx.strokeText('BREAK!', 0, 30); ctx.fillStyle = '#fff'; ctx.fillText('BREAK!', 0, 30);
    ctx.restore();
  }
  // ポップアップ
  for (const p of popups) {
    const k = p.age / p.max, sc = k < .16 ? easeOutBack(k / .16) : 1 + .025 * Math.sin(p.age * 14), a = k > .72 ? (1 - k) / .28 : 1;
    ctx.save(); ctx.globalAlpha = Math.max(0, a); ctx.translate(p.x, p.y - k * 26); ctx.scale(sc, sc);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 ${p.size}px "M PLUS Rounded 1c",system-ui,sans-serif`;
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(5, p.size * .17); ctx.strokeStyle = 'rgba(30,8,60,.92)'; ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.color === 'rainbow' ? `hsl(${(t * 400) % 360},100%,62%)` : p.color; ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
  // フラッシュ
  if (flashA > .005) { ctx.globalAlpha = Math.min(1, flashA); ctx.fillStyle = flashC; ctx.fillRect(-30, -30, W + 60, H + 60); ctx.globalAlpha = 1; }
}

/* ================= UI / 入力 ================= */
const scoreEl = $('score'), bestEl = $('best'), shotsEl = $('shots'), shotLbl = $('shotlbl');
for (let i = 0; i < MAX_SHOTS; i++) { const d = document.createElement('div'); d.className = 'dot'; shotsEl.appendChild(d); }
function updateShots() {
  [...shotsEl.children].forEach((d, i) => d.classList.toggle('off', i >= shots));
  shotLbl.textContent = shots > 0 ? `のこり${shots}発` : 'おしまい';
}
function loadBest() { try { best = parseInt(localStorage.getItem('blockcannon_best') || '0', 10) || 0; } catch (e) { best = 0; } bestEl.textContent = best; }
function saveBest() { try { localStorage.setItem('blockcannon_best', String(best)); } catch (e) {} }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.id); toast.id = setTimeout(() => { t.hidden = true; }, 2200); }

function resize() {
  const st = $('stage').getBoundingClientRect();
  if (st.width < 10 || st.height < 10) return;
  const sc = Math.min(st.width / W, st.height / H);
  const cw = W * sc, ch = H * sc;
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  vs = cv.width / W;
  bgGrad = null;
}
new ResizeObserver(resize).observe($('stage'));
window.addEventListener('resize', resize);

function setAimFromEvent(e) {
  const r = cv.getBoundingClientRect();
  const lx = (e.clientX - r.left) / r.width * W, ly = (e.clientY - r.top) / r.height * H;
  const dx = lx - PIVOT.x, dy = Math.max(PIVOT.y - ly, 14);
  aim = Math.max(-MAX_ANG, Math.min(MAX_ANG, Math.atan2(dx, dy)));
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); Snd.init();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  down = { t: performance.now(), x: e.clientX, y: e.clientY, moved: false, id: e.pointerId };
  setAimFromEvent(e);
});
cv.addEventListener('pointermove', e => {
  if (!down || e.pointerId !== down.id) return;
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) down.moved = true;
  setAimFromEvent(e);
});
cv.addEventListener('pointerup', e => {
  if (!down || e.pointerId !== down.id) return;
  const ok = !down.moved && performance.now() - down.t < LONG_MS;
  down = null;
  if (ok) fire();
});
cv.addEventListener('pointercancel', () => { down = null; });

const btnFire = $('btnFire');
btnFire.addEventListener('pointerdown', e => {
  e.preventDefault(); Snd.init();
  fireDown = { t: performance.now(), id: e.pointerId }; btnFire.classList.add('hold');
  try { btnFire.setPointerCapture(e.pointerId); } catch (_) {}
});
btnFire.addEventListener('pointerup', e => {

function bindRot(btn, dir) {

window.addEventListener('keydown', e => {

  else if (e.key === 'ArrowRight') { rotKey = 1; e.preventDefault(); }

});
window.addEventListener('keyup', e => { if ((e.key === 'ArrowLeft' && rotKey < 0) || (e.key === 'ArrowRight' && rotKey > 0)) rotKey = 0; });
window.addEventListener('blur', () => { down = null; fireDown = null; rotBtn = 0; rotKey = 0; btnFire.classList.remove('hold'); });
['gesturestart', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));

/* --- メニュー --- */
const menu = $('menu'), resultEl = $('result'), prev = $('prev');
function drawPreview() {
  const g = prev.getContext('2d');
  g.clearRect(0, 0, 360, 360); g.drawImage(img, 0, 0, 720, 720, 0, 0, 360, 360);
  g.strokeStyle = 'rgba(255,255,255,.3)'; g.lineWidth = 1; g.beginPath();
  for (let i = 1; i < COLS; i++) { g.moveTo(i * CELL, 0); g.lineTo(i * CELL, 360); g.moveTo(0, i * CELL); g.lineTo(360, i * CELL); }
  g.stroke();
}
const thumbs = $('thumbs'), thumbBtns = [];
function addThumb(canvas, onclick) {
  const b = document.createElement('button'); b.className = 'th'; const c = document.createElement('canvas'); c.width = c.height = 104;
  c.getContext('2d').drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, 104, 104);
  b.appendChild(c); b.addEventListener('click', () => { Snd.init(); Snd.ui(); onclick(); select(b); }); thumbs.appendChild(b); thumbBtns.push(b); return b;
}
function select(b) { thumbBtns.forEach(x => x.classList.toggle('sel', x === b)); }
PRESETS.forEach((p, i) => { const b = addThumb(p.canvas, () => setImageFrom(p.canvas, 720, 720)); if (i === 0) b.classList.add('sel'); });
let customThumb = null;
$('file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  Snd.init();
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      setImageFrom(im, im.naturalWidth, im.naturalHeight);
      customCanvas = img;
      if (customThumb) { thumbs.removeChild(customThumb); thumbBtns.splice(thumbBtns.indexOf(customThumb), 1); }
      customThumb = addThumb(customCanvas, () => setImageFrom(customCanvas, 720, 720)); select(customThumb);
      Snd.ui();
    };
    im.onerror = () => toast('この画像は読み込めませんでした。別の画像を選んでください');
    im.src = fr.result;
  };
  fr.onerror = () => toast('ファイルを読み込めませんでした');
  fr.readAsDataURL(f); e.target.value = '';
});
// legend
(() => {
  const box = $('legend'), desc = { 1: '5×5', 2: '横1列', 3: '縦1列', 4: 'ランダム9', 5: '超巨大' };
  [1, 2, 3, 4, 5].forEach(t => {
    const d = document.createElement('div'); d.className = 'lg';
    const c = document.createElement('canvas'); c.width = c.height = 72;
    const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 72, 72); gr.addColorStop(0, '#6b7bd6'); gr.addColorStop(1, '#3a4390'); g.fillStyle = gr; g.fillRect(0, 0, 72, 72);
    drawSpecial(g, t, 0, 0, 72, 0);
    d.appendChild(c); d.insertAdjacentHTML('beforeend', `<b>${SPC[t].name}</b><span>${desc[t]}</span>`); box.appendChild(d);
  });
})();

function openMenu() { menu.classList.add('show'); $('btnClose').hidden = (state === 'title'); }
function closeMenu() { menu.classList.remove('show'); }
function startGame() {
  Snd.init(); Snd.ui();
  gameId++;
  score = 0; shots = MAX_SHOTS; shotCount = 0; comboN = 0; scoreDirty = true;
  particles = []; popups = []; rings = []; beams = []; bolts = []; sched = []; ball = null; slowT = 0; shake = 0; flashA = 0;
  updateShots(); closeMenu(); resultEl.classList.remove('show');
  spawnBoard(); state = 'spawning';
}
function showResult() {
  const hi = score > best; if (hi) { best = score; saveBest(); }
  bestEl.textContent = best;
  const rank = score >= 220 ? 'S' : score >= 160 ? 'A' : score >= 100 ? 'B' : score >= 60 ? 'C' : 'D';
  $('rrank').textContent = rank; $('rscore').textContent = score;
  $('rbest').textContent = hi ? '🎉 ベスト更新！' : `ベスト ${best}`;
  const rk = $('rrank'); rk.style.animation = 'none'; void rk.offsetWidth; rk.style.animation = '';
  resultEl.classList.add('show');
  Snd.result(rank === 'S' || rank === 'A');
}
$('btnStart').addEventListener('click', startGame);
$('btnClose').addEventListener('click', () => { Snd.ui(); closeMenu(); });
$('btnMenu').addEventListener('click', () => { Snd.init(); Snd.ui(); openMenu(); });
$('btnRetry').addEventListener('click', startGame);
$('btnImg').addEventListener('click', () => { Snd.ui(); resultEl.classList.remove('show'); openMenu(); $('btnClose').hidden = true; });
$('btnSound').addEventListener('click', () => { Snd.init(); const m = Snd.toggle(); $('btnSound').textContent = m ? '🔇' : '🔊'; if (!m) Snd.ui(); });

/* ================= メインループ ================= */
let last = performance.now();
function frame(now) {
  const rdt = Math.min(.033, (now - last) / 1000); last = now;
  if (slowT > 0) slowT -= rdt;
  const dt = rdt * (slowT > 0 ? .28 : 1);
  update(dt, rdt);
  if (scoreDirty) { scoreEl.textContent = score; scoreEl.classList.remove('pop'); void scoreEl.offsetWidth; scoreEl.classList.add('pop'); scoreDirty = false; }
  const lp = !!((down && now - down.t > LONG_MS) || (fireDown && now - fireDown.t > LONG_MS));
  if (lp !== longFlag) { longFlag = lp; document.body.classList.toggle('longpress', lp); }
  draw(now / 1000);
  requestAnimationFrame(frame);
}

/* ================= 起動 ================= */
setImageFrom(PRESETS[0].canvas, 720, 720);
loadBest(); updateShots(); resize();
spawnBoard(); state = 'title';
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
