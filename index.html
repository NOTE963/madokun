<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>メガネくんゲーム</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:none; }
  input { font-size:16px; touch-action:manipulation; }
  html,body { width:100%; height:100%; background:#fff; overflow:hidden; font-family:'Courier New', monospace; }
  #stage { position:relative; width:100%; height:100%; max-width:520px; max-height:920px; margin:0 auto; background:#fff; overflow:hidden; }
  #bg { position:absolute; inset:0; background:#fff; }
  #vignette { display:none; position:absolute; inset:0; background:radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,0.6) 100%); pointer-events:none; z-index:25; }
  #score { position:absolute; bottom:16px; left:0; right:0; text-align:center; color:#222; font-size:13px; letter-spacing:2px; z-index:40; pointer-events:none; }

  #laneGuides { position:absolute; inset:0; z-index:9; pointer-events:none; opacity:0.12; }
  .laneLine { position:absolute; left:0; right:0; height:1px; background:#000; }
  #lanes { position:absolute; inset:0; z-index:10; }

  .giant { position:absolute; width:84px; transform:translate(-50%,-50%); pointer-events:none; will-change:left; }
  .giant img { width:84px; height:129px; display:block; }

  #player { position:absolute; left:14%; width:46px; height:46px; margin-left:-23px; margin-top:-23px; z-index:20; pointer-events:none; transition:top 0.16s cubic-bezier(.3,.9,.3,1); }
  #player .shadow { position:absolute; inset:10px -6px -2px -6px; background:radial-gradient(ellipse at center, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 75%); }
  #player .mark { position:absolute; left:50%; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, #7fd8ff 55%, #2f97c2 100%);
    box-shadow:0 0 12px rgba(127,216,255,0.95), 0 0 2px rgba(255,255,255,0.8); animation:markPulse 1.4s ease-in-out infinite; }
  @keyframes markPulse { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.28); } }

  #tapzone { position:absolute; inset:0; z-index:50; display:flex; flex-direction:column; }
  .tapHalf { flex:1; }

  #startScreen, #overScreen, #rankScreen {
    position:absolute; inset:0; background:radial-gradient(circle at 50% 30%, rgba(10,20,26,0.92), rgba(0,0,0,0.94) 75%); color:#eee;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; z-index:80; gap:14px; }
  #overScreen, #rankScreen { display:none; }
  #rankScreen { z-index:85; overflow-y:auto; padding:40px 22px 26px; justify-content:flex-start; }
  #rankScreen, #rankScreen * { touch-action:pan-y; }

  .title { font-size:26px; font-weight:800; letter-spacing:3px; color:#fff; text-shadow:0 0 2px rgba(255,255,255,0.4), 0 0 18px rgba(120,200,235,0.85), 0 0 36px rgba(120,200,235,0.4); }
  .sub { font-size:13px; line-height:1.8; color:#c9c9c9; max-width:340px; }
  .btn { padding:13px 30px; color:#08161c; background:linear-gradient(160deg, #7fd8ff, #2f97c2); font-weight:700; letter-spacing:2px; border:none; border-radius:999px; font-family:inherit; font-size:14px;
    box-shadow:0 4px 0 #1c6685, 0 6px 18px rgba(90,190,230,0.4); pointer-events:auto; cursor:pointer; transition:transform 0.08s ease, box-shadow 0.08s ease; }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #1c6685, 0 2px 8px rgba(90,190,230,0.3); }
  .btn.secondary { background:rgba(255,255,255,0.06); color:#eee; border:1px solid rgba(255,255,255,0.28); box-shadow:0 3px 0 rgba(255,255,255,0.06), 0 4px 14px rgba(0,0,0,0.35); }
  .btn.secondary:active { box-shadow:0 1px 0 rgba(255,255,255,0.06); }
  .btnRow { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  #face { height:120px; width:174px; filter:drop-shadow(0 0 10px rgba(255,255,255,0.35)); }

  #jumpscare { position:absolute; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; overflow:hidden; opacity:0; pointer-events:none; }
  #jumpscare img { height:130%; width:145%; object-fit:fill; transform:rotate(-8deg); filter:brightness(0.9) contrast(1.2); }
  #redflash { position:absolute; inset:0; background:#f00; opacity:0; z-index:95; pointer-events:none; }
  #scoreLine { font-size:15px; color:#fff; margin-top:6px; }
  #bestLine { font-size:12px; color:#999; }

  #muteBtn, #reloadBtn { position:absolute; top:12px; z-index:60; background:rgba(20,20,20,0.55); border:1px solid rgba(255,255,255,0.3); color:#eee; font-size:13px; width:32px; height:32px; border-radius:50%; line-height:1; cursor:pointer; pointer-events:auto; box-shadow:0 2px 8px rgba(0,0,0,0.4); }
  #muteBtn { right:14px; } #reloadBtn { right:50px; }

  #rankScreen .title { font-size:20px; }
  .weekLabel { font-size:11px; color:#999; letter-spacing:1px; }
  #nameRow { display:flex; gap:8px; align-items:center; margin-top:6px; }
  #usernameInput { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.3); color:#fff; font-family:inherit; padding:10px 12px; border-radius:10px; width:150px; letter-spacing:1px; }
  .btn.small { padding:10px 20px; font-size:12px; }
  #rankList { width:100%; max-width:340px; margin-top:8px; list-style:none; text-align:left; display:flex; flex-direction:column; gap:5px; }
  #rankList li { display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:9px 12px; background:linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02)); border:1px solid rgba(255,255,255,0.08); border-radius:8px; letter-spacing:0.5px; }
  #rankList li .rk { color:#ff6a4d; width:24px; flex-shrink:0; font-weight:700; }
  #rankList li .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 6px; }
  #rankList li .tm { color:#ffd23b; font-weight:600; }
  #rankStatus { font-size:12px; color:#888; min-height:16px; }

  #startScreen, #overScreen, #rankScreen { background:#fff; color:#222; }
  .title { color:#111; text-shadow:none; }
  .sub { color:#444; }
  #face { filter:none; }
  .btn.secondary { background:#f2f2f2; color:#222; border:1px solid #bbb; box-shadow:0 3px 0 #ddd; }
  #scoreLine { color:#111; } #bestLine, .weekLabel, #rankStatus { color:#777; }
  #usernameInput { background:#f5f5f5; border:1px solid #bbb; color:#111; }
  #rankList li { background:#f5f5f5; border:1px solid #ddd; color:#222; }
  #rankList li .tm { color:#c98a00; }
  #muteBtn, #reloadBtn { background:rgba(255,255,255,0.9); color:#222; border:1px solid #bbb; box-shadow:0 2px 6px rgba(0,0,0,0.15); }
  .btn, .btn.secondary, .btn.small { border-radius:0; box-shadow:none; letter-spacing:2px; }
  .btn { background:#111; color:#fff; border:2px solid #111; }
  .btn:active { transform:none; background:#444; }
  .btn.secondary { background:#fff; color:#111; border:2px solid #111; }
  .btn.secondary:active { background:#eee; }
  #usernameInput { border-radius:0; border:2px solid #111; background:#fff; }
  #nameStatus { font-size:12px; color:#2a7a33; min-height:16px; margin-top:-6px; }
  #rankList li { border-radius:0; }
  #muteBtn, #reloadBtn { border-radius:0; border:2px solid #111; box-shadow:none; }
</style>
</head>

    <div class="title">メガネくんゲーム</div>
    <div class="sub">
      画面の上側 / 下側をタップ・スワイプ・↑↓キーで<br>
      レーンを移動して避け続けろ。<br>
      生き残った時間が長いほどランキング上位。<br>
      当たれば終わり。
    </div>
    <div id="nameRow">
      <input id="usernameInput" type="text" maxlength="10" placeholder="ユーザーネーム">
      <button class="btn small secondary" id="saveNameBtn">保存</button>
    </div>
    <div id="nameStatus"></div>
    <div class="btnRow">
      <button class="btn" id="startBtn">生き残る</button>
      <button class="btn secondary" id="rankBtn">ランキング</button>
    </div>
  </div>

  <div id="overScreen">
    <div class="title">つかまった</div>
    <div id="scoreLine">生存時間: <span id="finalDist">0.0</span>秒</div>
    <div id="bestLine">自己ベスト: <span id="bestDist">0.0</span>秒</div>
    <div class="btnRow">
      <button class="btn" id="retryBtn">もう一度 / RETRY</button>
      <button class="btn secondary" id="overRankBtn">ランキング</button>
      <button class="btn secondary" id="overHomeBtn">ホームへ</button>
    </div>
  </div>

  <div id="rankScreen">
    <div class="title">ランキング</div>
    <div class="weekLabel">生存タイム</div>
    <div id="rankStatus">読み込み中...</div>
    <ol id="rankList"></ol>
    <button class="btn secondary" id="rankBackBtn">ホームへ戻る</button>
  </div>
</div>

<script>
(function(){
  // iOS zoom prevention
  ['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t, e=>e.preventDefault()));
  let lastTouchEndAt = 0;
  document.addEventListener('touchend', e=>{ const n=Date.now(); if(n-lastTouchEndAt<=300) e.preventDefault(); lastTouchEndAt=n; }, {passive:false});
  document.addEventListener('dblclick', e=>e.preventDefault());

  const $ = id => document.getElementById(id);
  const stage=$('stage'), lanesEl=$('lanes'), player=$('player'), scoreVal=$('scoreVal');
  const startScreen=$('startScreen'), overScreen=$('overScreen'), rankScreen=$('rankScreen');
  const jumpscare=$('jumpscare'), redflash=$('redflash'), laneGuides=$('laneGuides');
  const finalDist=$('finalDist'), bestDistEl=$('bestDist');
  const nameStatus=$('nameStatus'), usernameInput=$('usernameInput'), rankList=$('rankList'), rankStatus=$('rankStatus');
  const CHAR_SRC = $('face').src;

  // ----- lanes (rows, % from top) -----
  const ROWS = [24, 50, 76];
  const PLAYER_X = 14; // %
  const HIT_HALF = 2.6; // % of stage width (center-only, forgiving)
  for(let i=0;i<2;i++){
    const l=document.createElement('div'); l.className='laneLine';
    l.style.top=((ROWS[i]+ROWS[i+1])/2)+'%'; laneGuides.appendChild(l);
  }

  // ----- audio -----
  const muteBtn=$('muteBtn'), reloadBtn=$('reloadBtn');
  let audioCtx=null, master=null, droneGain=null, muted=false, nextHeartAt=0, heartInterval=900;
  function ensureAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    master = audioCtx.createGain(); master.gain.value = muted?0:0.75; master.connect(audioCtx.destination);
    droneGain = audioCtx.createGain(); droneGain.gain.value=0.0001; droneGain.connect(master);
    const lp = audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220; lp.connect(droneGain);
    [55,58.5].forEach(f=>{ const o=audioCtx.createOscillator(); o.type='sawtooth'; o.frequency.value=f; const g=audioCtx.createGain(); g.gain.value=0.5; o.connect(g); g.connect(lp); o.start(); });
    const lfo=audioCtx.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.12;
    const lg=audioCtx.createGain(); lg.gain.value=40; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  }
  function noiseBurst(dur,type,sf,ef,vol){
    if(!audioCtx||muted) return;
    const n=Math.floor(audioCtx.sampleRate*dur), buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=audioCtx.createBufferSource(); src.buffer=buf;
    const bp=audioCtx.createBiquadFilter(); bp.type=type||'bandpass';
    bp.frequency.setValueAtTime(sf,audioCtx.currentTime);
    if(ef) bp.frequency.exponentialRampToValueAtTime(ef,audioCtx.currentTime+dur);
    bp.Q.value=1.1;
    const g=audioCtx.createGain(); g.gain.setValueAtTime(vol,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    src.connect(bp); bp.connect(g); g.connect(master); src.start(); src.stop(audioCtx.currentTime+dur);
  }
  function heartThump(){
    if(!audioCtx||muted) return;
    const t=audioCtx.currentTime, o=audioCtx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(72,t); o.frequency.exponentialRampToValueAtTime(38,t+0.18);
    const g=audioCtx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.9,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.24);
  }
  function whoosh(){ noiseBurst(0.55,'bandpass',900,120,0.35); }
  function stinger(){
    noiseBurst(0.9,'lowpass',1400,80,0.9);
    if(!audioCtx) return;
    const t=audioCtx.currentTime, o=audioCtx.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(30,t+0.8);
    const g=audioCtx.createGain(); g.gain.setValueAtTime(0.7,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.9);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.9);
  }
  function fadeDrone(target,time){
    if(!droneGain||!audioCtx) return;
    droneGain.gain.cancelScheduledValues(audioCtx.currentTime);
    droneGain.gain.setValueAtTime(Math.max(droneGain.gain.value,0.0001),audioCtx.currentTime);
    droneGain.gain.exponentialRampToValueAtTime(Math.max(target,0.0001),audioCtx.currentTime+time);
  }
  muteBtn.addEventListener('click', e=>{ e.stopPropagation(); muted=!muted; muteBtn.textContent=muted?'🔇':'🔊'; if(master) master.gain.value=muted?0:0.75; });
  reloadBtn.addEventListener('click', e=>{ e.stopPropagation(); location.reload(); });

  // ----- Firebase -----
  const firebaseConfig = {
    apiKey: "AIzaSyASxo79YBtkxBWRFWzQtIoFdWw9iegkomI",
    authDomain: "haikyo-61102.firebaseapp.com",
    projectId: "haikyo-61102",
    storageBucket: "haikyo-61102.firebasestorage.app",
    messagingSenderId: "193210205676",
    appId: "1:193210205676:web:6977fc30bf4b9084a82cc9",
    measurementId: "G-ES8PVYT8MH"
  };
  let db=null;
  try{ firebase.initializeApp(firebaseConfig); db=firebase.firestore(); }catch(e){ console.error('firebase init failed',e); }

  function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function ensureUsername(){
    let n=lsGet('sidekunName','');
    if(!n){ n='名無し'+Math.floor(Math.random()*9000+1000); lsSet('sidekunName',n); }
    return n;
  }
  usernameInput.value = ensureUsername();
  $('saveNameBtn').addEventListener('click', ()=>{
    const v=usernameInput.value.trim().slice(0,10); if(!v) return;
    lsSet('sidekunName',v);
    nameStatus.textContent='保存しました';
    setTimeout(()=>{ nameStatus.textContent=''; },1500);
  });
  let userId=lsGet('sidekunUserId','');
  if(!userId){ userId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('u'+Date.now()+Math.random().toString(16).slice(2)); lsSet('sidekunUserId',userId); }

  const fmt = s => s.toFixed(1);
  const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function submitScore(t){
    if(!db||t<1) return;
    const name=ensureUsername(), rt=Math.round(t*10)/10, ref=db.collection('rankings').doc(userId);
    ref.get().then(doc=>{
      if(doc.exists && Number(doc.data().time)>=rt) return;
      return ref.set({ name, time:rt, ts:firebase.firestore.FieldValue.serverTimestamp() });
    }).catch(e=>console.error('submitScore failed',e));
  }
  function loadRanking(){
    rankStatus.textContent='読み込み中...'; rankList.innerHTML='';
    if(!db){ rankStatus.textContent='ランキングに接続できません'; return; }
    db.collection('rankings').limit(200).get().then(snap=>{
      if(snap.empty){ rankStatus.textContent='まだ記録がありません'; return; }
      rankStatus.textContent='';
      const rows=[]; snap.forEach(d=>rows.push(d.data()));
      rows.sort((a,b)=>(Number(b.time)||0)-(Number(a.time)||0));
      const seen=new Set();
      rows.filter(r=>{ const k=r.name||'???'; if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,30).forEach((d,i)=>{
        const li=document.createElement('li');
        li.innerHTML='<span class="rk">'+(i+1)+'</span><span class="nm">'+esc(d.name||'???')+'</span><span class="tm">'+Number(d.time).toFixed(1)+'秒</span>';
        rankList.appendChild(li);
      });
    }).catch(e=>{ console.error(e); rankStatus.textContent='読み込みに失敗しました: '+((e&&(e.code||e.message))||'不明なエラー'); });
  }
  function openRanking(){ rankScreen.style.display='flex'; loadRanking(); }
  $('rankBtn').addEventListener('click', openRanking);
  $('overRankBtn').addEventListener('click', openRanking);
  $('rankBackBtn').addEventListener('click', ()=>{ rankScreen.style.display='none'; });
  $('overHomeBtn').addEventListener('click', ()=>{ overScreen.style.display='none'; startScreen.style.display='flex'; });

  // ----- game state -----
  let rowIdx=1, running=false, gameOver=false, elapsed=0, score=0;
  let best=parseFloat(lsGet('sidekunBestTime','0'))||0;
  bestDistEl.textContent=fmt(best);
  let objs=[], spawnTimer=0, spawnInterval=1500, crossDuration=2400, lastTime=0;

  function setRow(i){ rowIdx=Math.max(0,Math.min(ROWS.length-1,i)); player.style.top=ROWS[rowIdx]+'%'; }
  player.style.left=PLAYER_X+'%'; setRow(1);
  const moveUp=()=>{ if(running&&!gameOver) setRow(rowIdx-1); };
  const moveDown=()=>{ if(running&&!gameOver) setRow(rowIdx+1); };

  window.addEventListener('keydown', e=>{
    if(e.code==='ArrowUp'||e.code==='KeyW'){ e.preventDefault(); moveUp(); }
    if(e.code==='ArrowDown'||e.code==='KeyS'){ e.preventDefault(); moveDown(); }
  });
  $('tapUp').addEventListener('pointerdown', moveUp);
  $('tapDown').addEventListener('pointerdown', moveDown);
  let tx=null, ty=null;
  stage.addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
  stage.addEventListener('touchend', e=>{
    if(tx===null) return;
    const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dy)>Math.abs(dx) && Math.abs(dy)>28) dy>0?moveDown():moveUp();
    tx=ty=null;
  }, {passive:true});

  function spawnGiant(){
    const row=Math.floor(Math.random()*ROWS.length);
    const el=document.createElement('div');
    el.className='giant';
    el.style.top=ROWS[row]+'%'; el.style.left='115%';
    el.innerHTML='<img src="'+CHAR_SRC+'" alt="">';
    lanesEl.appendChild(el);
    objs.push({el,row,t0:performance.now(),dur:crossDuration,x:115});
    whoosh();
  }

  function updateObjs(now){
    for(let i=objs.length-1;i>=0;i--){
      const o=objs[i], p=(now-o.t0)/o.dur;
      if(p>=1){ score++; o.el.remove(); objs.splice(i,1); continue; }
      const x=115-p*130;           // 115% -> -15%
      const bob=Math.sin(p*Math.PI*6+o.row*1.7)*0.9; // little walking bob (% of height)
      o.el.style.left=x+'%';
      o.el.style.top=(ROWS[o.row]+bob)+'%';
      // hitbox: only the very center of the giant counts, so grazing edges is safe
      if(o.row===rowIdx && Math.abs(x-PLAYER_X)<HIT_HALF){ triggerCatch(); return; }
    }
  }

  function loop(now){
    if(!lastTime) lastTime=now;
    const dt=Math.min(0.05,(now-lastTime)/1000); lastTime=now;
    if(running&&!gameOver){
      elapsed+=dt; spawnTimer+=dt*1000;
      spawnInterval=Math.max(380,1500-elapsed*34);
      crossDuration=Math.max(620,2400-elapsed*38);
      if(spawnTimer>=spawnInterval){
        spawnTimer=0; spawnGiant();
        if(elapsed>12 && Math.random()<0.35) setTimeout(()=>{ if(running&&!gameOver) spawnGiant(); },180);
      }
      updateObjs(now);
      scoreVal.textContent=fmt(elapsed);
      heartInterval=Math.max(260,900-elapsed*20);
      if(now>=nextHeartAt){ heartThump(); nextHeartAt=now+heartInterval; }
      if(droneGain&&audioCtx) droneGain.gain.setTargetAtTime(0.05+Math.min(1,elapsed/40)*0.16,audioCtx.currentTime,0.6);
    }
    requestAnimationFrame(loop);
  }

  function triggerCatch(){
    gameOver=true; running=false;
    stinger(); fadeDrone(0.0001,0.5);
    redflash.style.transition='opacity 0.06s linear'; redflash.style.opacity='0.85';
    jumpscare.style.transition='none'; jumpscare.style.opacity='1';
    let n=0; const iv=setInterval(()=>{
      stage.style.transform='translate('+(Math.random()*14-7)+'px,'+(Math.random()*14-7)+'px)';
      if(++n>10){ clearInterval(iv); stage.style.transform=''; }
    },40);
    setTimeout(()=>{ redflash.style.transition='opacity 0.4s linear'; redflash.style.opacity='0'; },160);
    submitScore(elapsed);
    setTimeout(()=>{
      finalDist.textContent=fmt(elapsed);
      if(elapsed>best){ best=elapsed; lsSet('sidekunBestTime',String(best)); }
      bestDistEl.textContent=fmt(best);
      overScreen.style.display='flex';
    },650);
    setTimeout(()=>{ jumpscare.style.transition='opacity 0.6s ease-out'; jumpscare.style.opacity='0'; },2200);
  }

  function startGame(){
    const nv=usernameInput.value.trim().slice(0,10); if(nv) lsSet('sidekunName',nv);
    ensureAudio(); if(audioCtx.state==='suspended') audioCtx.resume();
    startScreen.style.display='none'; overScreen.style.display='none'; rankScreen.style.display='none';
    jumpscare.style.opacity='0';
    objs.forEach(o=>o.el.remove()); objs=[];
    score=0; elapsed=0; spawnTimer=0; gameOver=false; spawnInterval=1500; crossDuration=2400;
    heartInterval=900; nextHeartAt=performance.now()+600;
    scoreVal.textContent='0.0';
    setRow(1); running=true; fadeDrone(0.05,1.2);
  }
  $('startBtn').addEventListener('click', startGame);
  $('retryBtn').addEventListener('click', startGame);

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
